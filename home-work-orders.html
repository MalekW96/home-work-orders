<title>Home Work Orders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a shop-floor ticket desk. Hairline panels, square-ish corners, mono work-order tags as the recurring motif, one blue accent, status colours kept separate from the accent. */
:root{
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f5f7f9; --ink:#14202e; --ink2:#465367; --muted:#66727f;
  --line:#dde3ea; --line2:#c6ced8; --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e4edfb;
  --danger:#b42323; --danger-soft:#fbe3e3; --track:#e6ebf1; --scrim:rgba(12,20,30,.45);
  --st-open-bg:#e3edfb; --st-open-fg:#1c4f9c;
  --st-prog-bg:#fdf0cf; --st-prog-fg:#7a4f00;
  --st-done-bg:#dcf3df; --st-done-fg:#0b5d1e;
  --st-cancel-bg:#e8ebef; --st-cancel-fg:#566170;
  --st-over-bg:#fbe0e0; --st-over-fg:#a02222;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --panel:#161d26; --panel2:#1b2430; --ink:#e7edf4; --ink2:#b5c0cd; --muted:#8794a4;
    --line:#263140; --line2:#34414f; --accent:#6da7ec; --accent-ink:#0b1a2e; --accent-soft:#1b2b44;
    --danger:#f08a8a; --danger-soft:#3a1c1c; --track:#243040; --scrim:rgba(0,0,0,.6);
    --st-open-bg:#1c2c47; --st-open-fg:#9cc0f7;
    --st-prog-bg:#3a2d0c; --st-prog-fg:#f2c15b;
    --st-done-bg:#12301a; --st-done-fg:#7fd38d;
    --st-cancel-bg:#262d36; --st-cancel-fg:#9aa6b4;
    --st-over-bg:#3c1a1a; --st-over-fg:#f19a9a;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161d26; --panel2:#1b2430; --ink:#e7edf4; --ink2:#b5c0cd; --muted:#8794a4;
  --line:#263140; --line2:#34414f; --accent:#6da7ec; --accent-ink:#0b1a2e; --accent-soft:#1b2b44;
  --danger:#f08a8a; --danger-soft:#3a1c1c; --track:#243040; --scrim:rgba(0,0,0,.6);
  --st-open-bg:#1c2c47; --st-open-fg:#9cc0f7;
  --st-prog-bg:#3a2d0c; --st-prog-fg:#f2c15b;
  --st-done-bg:#12301a; --st-done-fg:#7fd38d;
  --st-cancel-bg:#262d36; --st-cancel-fg:#9aa6b4;
  --st-over-bg:#3c1a1a; --st-over-fg:#f19a9a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1080px;margin:0 auto}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.stamp{font:600 15px/1 var(--mono);border:2px solid var(--ink);padding:8px 7px 7px;border-radius:3px;letter-spacing:.04em}
h1{font:700 28px/1.05 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel);padding:8px 14px;border-radius:4px;font-weight:500;min-height:38px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{background:none;border:1px solid transparent;border-radius:4px;width:34px;height:34px;font-size:22px;line-height:1;color:var(--ink2)}
.icon:hover{background:var(--panel2);border-color:var(--line)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);overflow-x:auto;margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font:500 12px var(--mono);color:var(--muted);margin-left:6px}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:1px solid var(--line2);background:var(--accent-soft);border-radius:4px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--danger-soft)}
.banner p{flex:1 1 18rem}

/* panels & dashboard */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.panel>h2,.sec-h{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-h h2{margin:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
@media(max-width:820px){.dash{grid-template-columns:minmax(0,1fr)}}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.strip>div{background:var(--panel);padding:12px 16px}
.k-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.k-v{font:700 30px/1.15 var(--disp);overflow-wrap:anywhere}
.k-v.bad{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;max-width:100%}
.seg button{background:var(--panel);border:0;padding:6px 12px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar-l{font-size:14px;overflow-wrap:anywhere}
.bar-l em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.bar-t{height:14px;background:var(--track);border-radius:0 4px 4px 0}
.bar-f{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.bar-v{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;text-align:right}
@media(max-width:520px){.bars li{grid-template-columns:minmax(0,1fr) auto}.bars .bar-t{grid-column:1/-1;grid-row:2}}
.split{display:flex;gap:2px;height:8px;margin-bottom:12px}
.split i{display:block;min-width:2px}
.split i:first-child{border-radius:4px 0 0 4px}.split i:last-child{border-radius:0 4px 4px 0}.split i:only-child{border-radius:4px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend b{width:10px;height:10px;border-radius:2px;display:block}
.legend span:last-child{font-variant-numeric:tabular-nums;font-weight:500}

/* status */
.pill{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap}
.pill.open{background:var(--st-open-bg);color:var(--st-open-fg)}
.pill.prog{background:var(--st-prog-bg);color:var(--st-prog-fg)}
.pill.done{background:var(--st-done-bg);color:var(--st-done-fg)}
.pill.cancel{background:var(--st-cancel-bg);color:var(--st-cancel-fg)}
.pill.over{background:var(--st-over-bg);color:var(--st-over-fg)}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}

/* ticket rows */
.tickets{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden}
.panel .tickets{border:0;border-radius:0;margin:-4px -16px -16px}
.tkt{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 10rem 8.5rem 7.5rem;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-top:1px solid var(--line);padding:12px 14px}
.tkt:first-child{border-top:0}
.panel .tickets .tkt:first-child{border-top:1px solid var(--line)}
.tkt:hover{background:var(--panel2)}
.tkt-no{font:600 13px var(--mono)}
.tkt-title{display:block;font-weight:600;overflow-wrap:anywhere}
.tkt-meta{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tkt-date{font-size:13px;color:var(--ink2)}
.tkt-cost{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
@media(max-width:760px){
  .tkt{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"no st" "main main" "date cost"}
  .tkt-no{grid-area:no}.tkt .pills{grid-area:st;justify-content:flex-end}.tkt-main{grid-area:main}.tkt-date{grid-area:date}.tkt-cost{grid-area:cost}
}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld.grow{flex:1 1 14rem}
.fld.span{grid-column:1/-1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;min-height:38px}
textarea{min-height:76px;resize:vertical}
.sumline{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink2);font-size:13px;margin:0 0 8px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* asset cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:10px}
.acard h3{font:700 22px/1.1 var(--disp);letter-spacing:.01em;overflow-wrap:anywhere}
.tagline{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{text-align:right;font-variant-numeric:tabular-nums}
.acard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.acard.arch{opacity:.7}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;font:600 13px var(--mono);color:var(--accent);text-decoration:underline;text-underline-offset:2px}

/* empty states */
.empty{border:1px dashed var(--line2);border-radius:4px;padding:28px 20px;color:var(--ink2);background:var(--panel)}
.empty h2{font:700 24px/1.1 var(--disp);color:var(--ink);margin-bottom:6px;text-transform:none;letter-spacing:.01em}
.empty p{max-width:46rem}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.steps{display:grid;gap:8px;margin:14px 0 0;counter-reset:s;max-width:46rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font:600 13px/26px var(--mono);text-align:center;border:1px solid var(--line2);border-radius:3px;height:28px;width:28px;color:var(--ink)}
.empty.small{padding:18px;text-align:left}
.empty.small h2{font-size:20px}

/* sheets (modals) */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal2{z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:780px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet.narrow{max-width:520px}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet-h h2{font:700 24px/1.15 var(--disp);letter-spacing:.01em;margin-top:2px;overflow-wrap:anywhere}
.tag{font:600 18px/1.2 var(--mono);letter-spacing:.02em;border:1.5px solid var(--ink);padding:3px 8px;border-radius:3px;display:inline-block}
.tag.pending{font:500 14px/1.3 var(--sans);border-style:dashed;border-color:var(--line2);color:var(--ink2)}
.sheet-b{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;min-height:0}
.sheet-f{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 6px 6px}
.sheet-f .tot span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sheet-f .tot strong{font:700 24px/1.1 var(--disp)}
.sheet-f .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:12px}
.hint{font-size:13px;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.line-r1{display:grid;grid-template-columns:7.5rem minmax(0,1fr) auto;gap:8px;align-items:end}
.line-r2{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:8px;align-items:end}
.line output{display:block;min-height:38px;padding:8px 0;font-variant-numeric:tabular-nums;font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.confirmrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;z-index:90;max-width:min(92vw,32rem);box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px}
.toast.bad{background:var(--danger);color:#fff}
@media(prefers-reduced-motion:no-preference){.sheet{animation:rise .16s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="stamp" aria-hidden="true">WO</span>
      <div>
        <h1>Home Work Orders</h1>
        <p class="sub">Every job on the house and the car, numbered, costed and on record.</p>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btn-report" data-action="report" disabled>PDF report</button>
      <button type="button" class="btn" id="btn-settings" data-action="settings">Settings</button>
      <button type="button" class="btn primary" id="btn-new" data-action="new-wo">New work order</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" class="tab" role="tab" id="tab-dashboard" data-action="tab" data-view="dashboard">Dashboard</button>
    <button type="button" class="tab" role="tab" id="tab-orders" data-action="tab" data-view="orders">Work orders<span class="n" id="n-orders"></span></button>
    <button type="button" class="tab" role="tab" id="tab-assets" data-action="tab" data-view="assets">Assets<span class="n" id="n-assets"></span></button>
    <button type="button" class="tab" role="tab" id="tab-parts" data-action="tab" data-view="parts">Parts &amp; costs</button>
  </nav>
  <div id="banner"></div>
  <main id="view" aria-live="polite"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="modal" id="modal2" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const localISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>localISO(new Date());
function parseD(s){ if(!s) return null; const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function fmtDate(s){ const d=parseD(s); return d?d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—'; }
const STATUSES=['Open','In progress','Completed','Cancelled'];
const TYPES=['Preventive maintenance','Repair','Inspection','Improvement','Other'];
const PRIORITIES=['Low','Normal','High'];
const CATEGORIES=['Home','Vehicle','Appliance','Garden & outdoor','Tools & equipment','Other'];
const METERS=[['','No meter'],['km','Kilometres (km)'],['mi','Miles (mi)'],['h','Running hours (h)']];
const KINDS=[['part','Part'],['labour','Labour'],['other','Other']];
const KIND_LABELS={part:['Quantity','Unit cost'],labour:['Hours','Rate per hour'],other:['Quantity','Amount each']};
const CURRENCIES=['SAR','AED','KWD','QAR','BHD','OMR','EGP','JOD','USD','EUR','GBP','INR','PKR','TRY'];

const S={db:null,user:null,downloads:null,noStore:false,readOnly:false,timedOut:false,
  assets:new Map(),orders:[],settings:{currency:'SAR'},ready:{assets:false,orders:false},
  view:'dashboard',range:'year',f:{status:'active',asset:'',year:'',q:''},partsQ:'',showArchived:false,
  wo:null,asset:null,saving:false,confirmClear:false,sheet:'',report:null};
const HOLDER='h'+Math.random().toString(36).slice(2,10);

let _nf=null,_nfCur='';
function money(n){
  const cur=(S.settings.currency||'SAR').toUpperCase();
  if(!_nf||_nfCur!==cur){ try{ _nf=new Intl.NumberFormat(undefined,{style:'currency',currency:cur}); }catch(e){ _nf={format:v=>cur+' '+Number(v).toFixed(2)}; } _nfCur=cur; }
  return _nf.format(Number(n)||0);
}
const num=v=>{ const n=Number(v); return isFinite(n)?n:0; };
const lineTotal=l=>num(l.qty)*num(l.unitCost);
function orderTotals(o){
  const t={part:0,labour:0,other:0,all:0};
  for(const l of (o.lines||[])){ const v=lineTotal(l); const k=(l.kind==='part'||l.kind==='labour')?l.kind:'other'; t[k]+=v; t.all+=v; }
  return t;
}
const orderDate=o=>o.completedOn||o.openedOn||'';
const isActive=o=>o.status==='Open'||o.status==='In progress';
const isOverdue=o=>isActive(o)&&o.dueOn&&o.dueOn<todayISO();
const assetName=id=>{ const a=S.assets.get(id); return a?a.name:'Unknown asset'; };
const byName=(a,b)=>String(a.name).localeCompare(String(b.name));
const byNumberDesc=(a,b)=>(num(b.year)-num(a.year))||(num(b.seq)-num(a.seq))||String(b.id).localeCompare(String(a.id));
const canWrite=()=>!!S.db&&!S.readOnly;
const fmtMeter=(v,u)=>(v==null||v==='')?'—':Number(v).toLocaleString()+(u?' '+u:'');
function opt(pairs,cur){ return pairs.map(p=>`<option value="${esc(p[0])}"${String(p[0])===String(cur)?' selected':''}>${esc(p[1])}</option>`).join(''); }
function pill(status){ const c={'Open':'open','In progress':'prog','Completed':'done','Cancelled':'cancel'}[status]||'open'; return `<span class="pill ${c}">${esc(status)}</span>`; }

let toastTimer=null;
function toast(msg,bad){ const t=$('#toast'); t.textContent=msg; t.className='toast'+(bad?' bad':''); t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.hidden=true;},bad?6000:3200); }
function fail(e,what){
  const c=e&&e.code; let m;
  if(c==='quota_exceeded') m='Storage is full, so this could not be saved. Remove some old records first.';
  else if(c==='invalid_argument') m='This view cannot change records. Open the page from your own account to edit.';
  else if(c==='revoked') m='Access to this page was withdrawn.';
  else m=(e&&e.message)?e.message:'Something went wrong.';
  toast((what?what+': ':'')+m,true);
}

/* ---------- storage ---------- */
async function allocateNumber(){
  const year=new Date().getFullYear();
  const lock=S.db.doc('meta/numbering');
  let state='busy';
  for(let i=0;i<4;i++){
    try{ const r=await lock.acquire({holder:HOLDER,ttlMs:6000}); if(r&&r.acquired){state='held';break;} }
    catch(e){ state='skipped'; break; }
    await sleep(700);
  }
  if(state==='busy') throw new Error('Another device is issuing a number right now. Try again in a moment.');
  const snap=await S.db.collection('workorders').where('year','==',year).orderBy('seq','desc').limit(1).get();
  const seq=snap.empty?1:(num(snap.docs[0].data().seq)+1);
  return {year,seq,number:'WO-'+year+'-'+String(seq).padStart(4,'0')};
}

async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use){ S.noStore=true; render(); return; }
  const get=n=>c.use(n).catch(()=>null);
  const [db,user,dl]=await Promise.all([get('db'),get('user'),get('downloads')]);
  S.downloads=dl; S.user=user;
  if(!db){ S.noStore=true; render(); return; }
  S.db=db;
  if(user){ try{ if((await user.can('data.write'))===false) S.readOnly=true; }catch(e){} }
  const timer=setTimeout(()=>{ S.timedOut=true; render(); },10000);
  const ok=()=>{ clearTimeout(timer); S.timedOut=false; };
  const bad=e=>{ clearTimeout(timer); if(e&&e.code==='revoked'){ S.noStore=true; } S.timedOut=true; render(); };
  db.collection('assets').onSnapshot(snap=>{
    S.assets=new Map(snap.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));
    S.ready.assets=true; ok(); render();
  },bad);
  db.collection('workorders').onSnapshot(snap=>{
    S.orders=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.ready.orders=true; ok(); render();
  },bad);
  db.doc('meta/settings').onSnapshot(s=>{
    if(s.exists){ S.settings=Object.assign({currency:'SAR'},s.data()); }
    render();
  },()=>{});
}

function render(){ renderChrome(); renderView(); if(S.sheet==='settings') renderSettings(); }

function renderChrome(){
  ['dashboard','orders','assets','parts'].forEach(v=>{ const t=$('#tab-'+v); t.setAttribute('aria-selected',String(S.view===v)); t.tabIndex=S.view===v?0:-1; });
  const open=S.orders.filter(isActive).length;
  $('#n-orders').textContent=open?String(open):'';
  $('#n-assets').textContent=S.assets.size?String([...S.assets.values()].filter(a=>!a.archived).length):'';

  if(S.noStore) h=`<div class="banner warn"><p>Records can't be loaded or saved in this view. Open the page from your Claude artifacts while signed in to use it.</p></div>`;

}

function renderView(){
  const v=$('#view');
  if(S.noStore){ v.innerHTML=emptyIntro(false); return; }
  if(!(S.ready.assets&&S.ready.orders)){ v.innerHTML=emptyIntro(true); return; }

function rangeStart(){ const d=new Date(); if(S.range==='year') return d.getFullYear()+'-01-01'; if(S.range==='12m'){ d.setFullYear(d.getFullYear()-1); return localISO(d); } return ''; }
function orderRow(o){
  const t=orderTotals(o); const od=isOverdue(o);

  if(o.status==='Completed') dt='Done '+fmtDate(o.completedOn);
  else if(o.status!=='Cancelled'&&o.dueOn) dt='Due '+fmtDate(o.dueOn);
  else dt='Opened '+fmtDate(o.openedOn);
  return `<button type="button" class="tkt" data-action="open-wo" data-id="${esc(o.id)}">
    <span class="tkt-no">${esc(o.number||o.id)}</span>
    <span class="tkt-main"><span class="tkt-title">${esc(o.title)}</span><span class="tkt-meta">${esc(assetName(o.assetId))} · ${esc(o.type||'')}</span></span>
    <span class="pills">${pill(o.status)}${od?'<span class="pill over">Overdue</span>':''}</span>
    <span class="tkt-date">${esc(dt)}</span>

}

  return `<div class="strip">

  <div class="dash"><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Needs attention</h2></div>
      ${attention.length?`<div class="tickets">${attention.map(orderRow).join('')}</div>`:`<p class="muted">Nothing open. New jobs you start will be listed here, overdue ones first.</p>`}</section>

      <div class="seg" role="group" aria-label="Period">${[['year','This year'],['12m','12 months'],['all','All time']].map(r=>`<button type="button" data-action="range" data-range="${r[0]}" aria-pressed="${S.range===r[0]}">${r[1]}</button>`).join('')}</div></div>

/* work orders list */
function filteredOrders(){
  const q=S.f.q.trim().toLowerCase();
  return S.orders.filter(o=>{
    if(S.f.status==='active'){ if(!isActive(o)) return false; } else if(S.f.status!=='all'&&o.status!==S.f.status) return false;
    if(S.f.asset&&o.assetId!==S.f.asset) return false;
    if(S.f.year&&String(orderDate(o)).slice(0,4)!==S.f.year) return false;
    if(q){ const hay=[o.number,o.title,o.description,o.notes,o.doneBy,o.type,assetName(o.assetId)].concat((o.lines||[]).map(l=>[l.name,l.partNo,l.supplier].join(' '))).join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  }).sort(byNumberDesc);
}

/* assets */
function assetStats(){
  const m=new Map();
  for(const o of S.orders){
    let s=m.get(o.assetId); if(!s){ s={n:0,open:0,spent:0,last:'',meter:null,meterDate:''}; m.set(o.assetId,s); }
    s.n++; if(isActive(o)) s.open++;
    if(o.status!=='Cancelled') s.spent+=orderTotals(o).all;
    if(o.status==='Completed'&&o.completedOn&&o.completedOn>s.last) s.last=o.completedOn;
    const d=orderDate(o); if(o.meter!=null&&o.meter!==''&&d>=s.meterDate){ s.meter=o.meter; s.meterDate=d; }
  }
  return m;
}
function assetsView(){
  const stats=assetStats();
  const all=[...S.assets.values()].sort(byName);
  const list=all.filter(a=>S.showArchived||!a.archived);
  const archivedCount=all.filter(a=>a.archived).length;
  const head=`<div class="toolbar"><div>${archivedCount?`<button type="button" class="btn sm ghost" data-action="toggle-archived">${S.showArchived?'Hide':'Show'} archived (${archivedCount})</button>`:''}</div><button type="button" class="btn primary" data-action="new-asset"${canWrite()?'':' disabled'}>Add asset</button></div>`;
  if(!list.length) return head+`<div class="empty small"><h2>No assets yet</h2><p>Add the things you maintain: a car, a room, an appliance. Work orders are opened against them.</p></div>`;
  return head+`<div class="cards">${list.map(a=>{
    const s=stats.get(a.id)||{n:0,open:0,spent:0,last:'',meter:null};
    return `<article class="panel acard${a.archived?' arch':''}"><div><p class="tagline">${esc(a.category||'Other')}${a.archived?' · Archived':''}</p><h3>${esc(a.name)}</h3>${a.details?`<p class="muted">${esc(a.details)}</p>`:''}</div>
      <dl class="facts"><dt>Work orders</dt><dd>${s.n}${s.open?` (${s.open} open)`:''}</dd><dt>Total spent</dt><dd>${money(s.spent)}</dd><dt>Last service</dt><dd>${s.last?fmtDate(s.last):'—'}</dd>${a.meterUnit?`<dt>Last reading</dt><dd>${fmtMeter(s.meter,a.meterUnit)}</dd>`:''}</dl>
      <div class="acts"><button type="button" class="btn sm" data-action="asset-history" data-id="${esc(a.id)}">History</button><button type="button" class="btn sm" data-action="asset-wo" data-id="${esc(a.id)}"${canWrite()&&!a.archived?'':' disabled'}>New work order</button><button type="button" class="btn sm ghost" data-action="edit-asset" data-id="${esc(a.id)}">Edit</button></div></article>`;
  }).join('')}</div>`;
}

/* parts */
function partRows(){
  const q=S.partsQ.trim().toLowerCase(); const rows=[];
  for(const o of S.orders){ if(o.status==='Cancelled') continue; for(const l of (o.lines||[])){ if(l.kind!=='part') continue;

  return rows.sort((a,b)=>orderDate(b.o).localeCompare(orderDate(a.o))||byNumberDesc(a.o,b.o));

function onWoInput(e){

async function saveWO(){

  if(w.meter!==''&&!isFinite(Number(w.meter))){ toast('The reading must be a number.',true); return; }
  const lines=w.lines.filter(l=>l.name.trim()||num(l.unitCost)).map(l=>({kind:l.kind,name:l.name.trim(),partNo:(l.partNo||'').trim(),supplier:(l.supplier||'').trim(),qty:num(l.qty===''?1:l.qty),unitCost:num(l.unitCost)}));

    followUpOf:w.followUpOf||'',sample:!!w.sample,updatedAt:now};

}

async function saveAsset(){
  const a=S.asset; if(!a) return;
  if(!a.name.trim()){ toast('Give the asset a name.',true); $('#as-name')&&$('#as-name').focus(); return; }
  const doc={name:a.name.trim(),category:a.category,details:a.details.trim(),meterUnit:a.meterUnit,notes:a.notes.trim(),archived:!!a.archived,sample:!!a.sample,updatedAt:new Date().toISOString()};
  try{
    let id=a.id;
    if(a.isNew){ doc.createdAt=doc.updatedAt; const ref=await S.db.collection('assets').add(doc); id=ref.id; }
    else { const old=S.assets.get(a.id)||{}; doc.createdAt=old.createdAt||doc.updatedAt; await S.db.doc('assets/'+a.id).set(doc); }
    toast('Saved '+doc.name);
    const back=a.fromWO&&S.wo;
    if(back){ S.assets.set(id,Object.assign({id},doc)); S.wo.assetId=id; }
    S.asset=null; renderAsset();
    if(back) renderWO('wo-asset');
  }catch(e){ fail(e,'Not saved'); }
}
async function toggleArchive(){
  const a=S.asset; if(!a||a.isNew) return;
  const old=S.assets.get(a.id); if(!old) return;
  try{ const doc=Object.assign({},old); delete doc.id; doc.archived=!old.archived; doc.updatedAt=new Date().toISOString(); await S.db.doc('assets/'+a.id).set(doc); toast(doc.archived?'Archived '+old.name:'Restored '+old.name); S.asset=null; renderAsset(); }
  catch(e){ fail(e,'Not saved'); }
}
async function deleteAsset(){
  const a=S.asset; if(!a||a.isNew) return;
  if(!a.confirmDelete){ a.confirmDelete=true; renderAsset(); return; }
  try{ await S.db.doc('assets/'+a.id).delete(); toast('Deleted '+a.name); S.asset=null; renderAsset(); }
  catch(e){ fail(e,'Not deleted'); }
}

/* ---------- PDF report ---------- */
/* REPORT-START */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pdfDate(s){ const d=parseD(s); return d?d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear():''; }
function pdfMoney(n){ return String(S.settings.currency||'SAR').toUpperCase()+' '+num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* The built-in PDF fonts cover Latin text only, so anything else is swapped for "?" rather than drawn as noise. */
function pdfText(s){ return String(s==null?'':s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[  ]/g,' ').replace(/[^\n\x20-\x7E\xA1-\xFF]/g,'?'); }
function reportData(opt){
  let start=''; const d=new Date();
  if(opt.period==='year') start=d.getFullYear()+'-01-01';
  else if(opt.period==='12m'){ d.setFullYear(d.getFullYear()-1); start=localISO(d); }
  const list=S.orders.filter(o=>o.status!=='Cancelled'&&(!opt.asset||o.assetId===opt.asset)&&(!start||orderDate(o)>=start)).sort((a,b)=>byNumberDesc(b,a));
  return {start,list};
}
function buildReportPDF(deps,opt){
  const list=reportData(opt).list;
  const doc=new deps.JsPDF({unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=14;
  const ACC=[31,95,191], INK=[20,32,46], MUT=[102,114,127];
  const periodLabel={year:'This year ('+new Date().getFullYear()+')','12m':'Last 12 months',all:'All time'}[opt.period]||'All time';
  const assetLabel=opt.asset?assetName(opt.asset):'All assets';
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(INK[0],INK[1],INK[2]); doc.text('Maintenance report',M,20);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
  doc.text('Home Work Orders',M,26);
  doc.text(pdfText('Period: '+periodLabel+'    Asset: '+assetLabel+'    Generated: '+pdfDate(todayISO())),M,31);
  doc.setDrawColor(ACC[0],ACC[1],ACC[2]); doc.setLineWidth(0.6); doc.line(M,34,W-M,34);

  const tot={part:0,labour:0,other:0,all:0}; let done=0, open=0; const byAsset=new Map();
  for(const o of list){
    const t=orderTotals(o); tot.part+=t.part; tot.labour+=t.labour; tot.other+=t.other; tot.all+=t.all;
    if(o.status==='Completed') done++; else if(isActive(o)) open++;
    const e=byAsset.get(o.assetId)||{n:0,part:0,labour:0,other:0,all:0};
    e.n++; e.part+=t.part; e.labour+=t.labour; e.other+=t.other; e.all+=t.all; byAsset.set(o.assetId,e);
  }
  let y=44;
  const figs=[['Total cost',pdfMoney(tot.all)],['Work orders',String(list.length)],['Completed',String(done)],['Open',String(open)]];
  const cw=(W-2*M)/figs.length;
  figs.forEach((f,i)=>{
    const x=M+i*cw;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(MUT[0],MUT[1],MUT[2]); doc.text(f[0].toUpperCase(),x,y);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(INK[0],INK[1],INK[2]); doc.text(pdfText(f[1]),x,y+7);
  });
  y+=18;

  const section=title=>{ if(y>H-45){ doc.addPage(); y=20; } doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(INK[0],INK[1],INK[2]); doc.text(title,M,y); y+=3; };
  const table=o=>{
    const cfg=Object.assign({startY:y,margin:{left:M,right:M,bottom:16},theme:'striped',
      styles:{font:'helvetica',fontSize:8.5,cellPadding:1.8,textColor:INK,overflow:'linebreak'},
      headStyles:{fillColor:ACC,textColor:255,fontStyle:'bold'},
      footStyles:{fillColor:[230,235,241],textColor:INK,fontStyle:'bold'},
      alternateRowStyles:{fillColor:[245,247,249]}},o);
    if(deps.autoTable) deps.autoTable(doc,cfg); else doc.autoTable(cfg);
    y=doc.lastAutoTable.finalY+9;
  };
  const right=[1,2,3,4,5].reduce((m,i)=>{ m[i]={halign:'right'}; return m; },{});

  if(!opt.asset&&byAsset.size){
    section('Spend by asset');
    const rows=[...byAsset.entries()].sort((a,b)=>b[1].all-a[1].all);
    table({head:[['Asset','Orders','Parts','Labour','Other','Total']],
      body:rows.map(r=>[pdfText(assetName(r[0])),String(r[1].n),pdfMoney(r[1].part),pdfMoney(r[1].labour),pdfMoney(r[1].other),pdfMoney(r[1].all)]),
      foot:[['All assets',String(list.length),pdfMoney(tot.part),pdfMoney(tot.labour),pdfMoney(tot.other),pdfMoney(tot.all)]],
      showFoot:'lastPage',columnStyles:right});
  }

  section('Work orders');
  table({head:[['No.','Date','Asset','Title','Status','Cost']],
    body:list.map(o=>[o.number||o.id,pdfDate(orderDate(o)),pdfText(assetName(o.assetId)),pdfText(o.title),o.status,pdfMoney(orderTotals(o).all)]),
    columnStyles:{0:{cellWidth:28},1:{cellWidth:23},2:{cellWidth:34},4:{cellWidth:22},5:{cellWidth:28,halign:'right'}}});

  if(opt.parts){
    const prow=[]; for(const o of list) for(const l of (o.lines||[])) if(l.kind==='part') prow.push([pdfDate(orderDate(o)),pdfText(l.name),pdfText(l.partNo),String(num(l.qty)),pdfMoney(num(l.unitCost)),pdfMoney(lineTotal(l)),pdfText(l.supplier),o.number||o.id]);
    if(prow.length){
      section('Parts used');
      table({head:[['Date','Part','Part no.','Qty','Unit cost','Total','Supplier','Work order']],body:prow,
        styles:{font:'helvetica',fontSize:8,cellPadding:1.6,textColor:INK,overflow:'linebreak'},
        columnStyles:{0:{cellWidth:19},2:{cellWidth:22},3:{cellWidth:10,halign:'right'},4:{cellWidth:22,halign:'right'},5:{cellWidth:22,halign:'right'},7:{cellWidth:27}}});
    }
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    doc.text('Cancelled work orders are not included.',M,H-8); doc.text('Page '+i+' of '+n,W-M,H-8,{align:'right'});
  }
  return doc;
}

  const host=$('#modal'); host.hidden=false; const r=S.report;
  const assets=[...S.assets.values()].sort(byName);
  host.innerHTML=`<div class="scrim" data-action="close-modal"></div>
  <section class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="rp-h">
   <header class="sheet-h"><div><p class="eyebrow">PDF report</p><h2 id="rp-h">Maintenance report</h2></div><button type="button" class="icon" data-action="close-modal" aria-label="Close">&times;</button></header>
   <div class="sheet-b">
    <label class="fld"><span>Period</span><select id="rp-period">${opt([['year','This year'],['12m','Last 12 months'],['all','All time']],r.period)}</select></label>
    <label class="fld"><span>Asset</span><select id="rp-asset">${opt([['','All assets']].concat(assets.map(a=>[a.id,a.name])),r.asset)}</select></label>
    <label class="chk"><input id="rp-parts" type="checkbox"${r.parts?' checked':''}><span>Include the list of parts used</span></label>
    <p class="hint" id="rp-count"></p>
    <p class="hint">Cancelled work orders are left out. Text outside the Latin alphabet shows as "?" in the PDF.</p>
   </div>
   <footer class="sheet-f"><span></span><div class="acts"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="make-report"${S.saving?' disabled':''}>${S.saving?'Creating…':'Create PDF'}</button></div></footer></section>`;
  syncInert(); updateReportCount();
}
async function makeReport(){
  if(S.saving||!S.report) return;
  const jp=window.jspdf&&window.jspdf.jsPDF;
  if(!jp){ toast('The PDF library did not load. Check your connection and reload the page.',true); return; }
  if(!S.downloads){ toast('Downloads are not available in this view.',true); return; }
  if(!reportData(S.report).list.length){ toast('No work orders match these choices.',true); return; }
  S.saving=true; renderReport();
  try{
    const doc=buildReportPDF({JsPDF:jp,autoTable:window.jspdf.autoTable},S.report);
    const data=doc.output('arraybuffer');
    await S.downloads.save({filename:'maintenance-report-'+todayISO()+'.pdf',data});
    S.saving=false; closeSheet('report'); toast('Report saved');
  }catch(e){
    S.saving=false; renderReport();
    if(!(e&&e.code==='declined')) toast(e&&e.code==='unavailable'?'Downloads are not available here.':'The report could not be created.',true);
  }
}

/* ---------- sheets plumbing ---------- */
function syncInert(){
  const m1=$('#modal'),m2=$('#modal2');
  $('#app').inert=!m1.hidden||!m2.hidden;
  m1.inert=!m2.hidden;
}
function closeSheet(which){
  if(which==='wo'||which==='settings'||which==='report'){ S.wo=null; S.sheet=''; const h=$('#modal'); h.innerHTML=''; h.hidden=true; }
  syncInert();
}
function closeTop(){
  if(!$('#modal2').hidden){ S.asset=null; renderAsset(); return; }
  if(!$('#modal').hidden) closeSheet(S.sheet||'wo');
}

/* ---------- events ---------- */
function setView(v){ S.view=v; if(location.hash!=='#'+v){ try{ location.hash=v; }catch(e){} } render(); window.scrollTo(0,0); }
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  switch(a){
    case 'tab': setView(el.dataset.view); break;
    case 'new-wo': if(canWrite()) openWO(null); break;
    case 'open-wo': openWO(id); break;
    case 'close-modal': closeSheet(S.sheet||'wo'); break;
    case 'close-modal2': S.asset=null; renderAsset(); break;
    case 'save-wo': saveWO(); break;
    case 'followup': { const w=S.wo; if(w) openWO(null,{assetId:w.assetId,title:w.title,type:w.type,followUpOf:w.number}); break; }
    case 'add-line': if(S.wo){ S.wo.lines.push({kind:el.dataset.kind,name:'',partNo:'',supplier:'',qty:'1',unitCost:''}); renderWO('ln-'+(S.wo.lines.length-1)+'-name'); } break;
    case 'del-line': if(S.wo){ S.wo.lines.splice(+el.dataset.i,1); renderWO(); } break;
    case 'new-asset': if(canWrite()) openAsset(null,false); break;
    case 'edit-asset': openAsset(id,false); break;
    case 'asset-history': S.f={status:'all',asset:id,year:'',q:''}; setView('orders'); break;
    case 'asset-wo': if(canWrite()) openWO(null,{assetId:id}); break;
    case 'save-asset': saveAsset(); break;
    case 'archive-asset': toggleArchive(); break;
    case 'delete-asset': deleteAsset(); break;
    case 'settings': openSettings(); break;
    case 'export': exportData(el.dataset.what); break;
    case 'report': openReport(); break;
    case 'make-report': makeReport(); break;
    case 'clear-samples': clearSamples(); break;
    case 'range': S.range=el.dataset.range; render(); break;
    case 'toggle-archived': S.showArchived=!S.showArchived; render(); break;
  }
});
function onInput(e){
  const t=e.target; if(!t||!t.id&&!t.dataset) return;
  if(t.dataset&&t.dataset.af!==undefined&&S.asset){ S.asset[t.dataset.af]=t.value; return; }
  if(t.closest&&t.closest('#modal')&&S.wo&&S.sheet==='wo'){ onWoInput(e); return; }
  switch(t.id){
    case 'f-q': S.f.q=t.value; $('#orders-results').innerHTML=ordersResults(); break;
    case 'f-status': S.f.status=t.value; $('#orders-results').innerHTML=ordersResults(); break;
    case 'f-asset': S.f.asset=t.value; $('#orders-results').innerHTML=ordersResults(); break;
    case 'f-year': S.f.year=t.value; $('#orders-results').innerHTML=ordersResults(); break;
    case 'p-q': S.partsQ=t.value; $('#parts-results').innerHTML=partsResults(); break;
    case 'rp-period': if(S.report){ S.report.period=t.value; updateReportCount(); } break;
    case 'rp-asset': if(S.report){ S.report.asset=t.value; updateReportCount(); } break;
    case 'rp-parts': if(S.report) S.report.parts=!!t.checked; break;
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='st-cur'){ saveCurrency(e.target.value); return; }
  onInput(e);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(!$('#modal').hidden||!$('#modal2').hidden)){ e.preventDefault(); closeTop(); } });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['dashboard','orders','assets','parts'].indexOf(h)>=0&&h!==S.view){ S.view=h; render(); } });
(function(){ const h=location.hash.slice(1); if(['dashboard','orders','assets','parts'].indexOf(h)>=0) S.view=h; })();

boot();
})();
</script>
