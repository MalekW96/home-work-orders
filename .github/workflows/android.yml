name: Android build

# Builds the Android APK (debug-signed, like the Android Studio "Build APK" in the README).
# Download it from the run's Artifacts, or let it attach to a GitHub release when one is published.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - "android/**"
      - "home-work-orders.html"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate the APK
        id: apk
        run: |
          f=$(ls android/apk/HomeWorkOrders-v*.apk | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "Built $f"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeWorkOrders-apk
          path: ${{ steps.apk.outputs.path }}

      # When a GitHub release is published, attach the APK to it next to the .ipa.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk.outputs.path }}" --clobber
