name: Android build

# Builds the Android APK (debug-signed, like the Android Studio "Build APK" in the README).
# Download it from the run's Artifacts, or let it attach to a GitHub release when one is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: attach the built APK to this existing release tag (for example v2.6.0.0)"
        required: false
        type: string
  release:
    types: [published]
  push:
    paths:
      - "android/**"
      - "home-work-orders.html"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sign with your own debug key so the APK installs over the one built in Android Studio.
      # Add the secret DEBUG_KEYSTORE_B64 (base64 of ~/.android/debug.keystore) to enable this;
      # without it the build uses a throwaway key and phones must reinstall the app.
      - name: Use your debug key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "HWO_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using the debug key from the DEBUG_KEYSTORE_B64 secret. Its certificate:"
            keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey | grep -i -E "SHA-?256|fingerprint" || { echo "::error::The keystore could not be read (wrong alias or password, or a damaged secret)."; exit 1; }
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is not set; the APK is signed with a new key and will not update over Android Studio builds."
          fi

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify the APK is signed with your key
        if: env.HWO_KEYSTORE != ''
        run: |
          want=$(keytool -list -keystore "$HWO_KEYSTORE" -storepass android -alias androiddebugkey | grep -i "SHA-256" | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs android/apk/HomeWorkOrders-v*.apk | grep -i "SHA-256 digest" | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Key in secret : $want"
          echo "Key in the APK: $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::The APK is not signed with the key from DEBUG_KEYSTORE_B64."; exit 1; }

      - name: Locate the APK
        id: apk
        run: |
          f=$(ls android/apk/HomeWorkOrders-v*.apk | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "Built $f"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeWorkOrders-apk
          path: ${{ steps.apk.outputs.path }}

      # When a GitHub release is published, attach the APK to it next to the .ipa.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk.outputs.path }}" --clobber

      # Manual run with a tag: attach the APK to that existing release.
      - name: Attach to an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.apk.outputs.path }}" --clobber
