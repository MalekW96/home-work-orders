<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>I Got This</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a shop-floor ticket desk. Hairline panels, square-ish corners, mono work-order tags as the recurring motif, one blue accent, status colours kept separate from the accent. */
:root{
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f5f7f9; --ink:#14202e; --ink2:#465367; --muted:#66727f;
  --line:#dde3ea; --line2:#c6ced8; --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e4edfb;
  --danger:#b42323; --danger-soft:#fbe3e3; --track:#e6ebf1; --scrim:rgba(12,20,30,.45);
  --st-open-bg:#e3edfb; --st-open-fg:#1c4f9c;
  --st-prog-bg:#fdf0cf; --st-prog-fg:#7a4f00;
  --st-further-bg:#ffe5d0; --st-further-fg:#8a3a00;
  --st-done-bg:#dcf3df; --st-done-fg:#0b5d1e;
  --st-cancel-bg:#e8ebef; --st-cancel-fg:#566170;
  --st-over-bg:#fbe0e0; --st-over-fg:#a02222;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
  --shadow:0 1px 2px rgba(20,32,46,.08),0 1px 1px rgba(20,32,46,.04);
  --hero1:#1f5fbf; --hero2:#174a96; --hero-sh:0 8px 20px rgba(31,95,191,.28);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --panel:#161d26; --panel2:#1b2430; --ink:#e7edf4; --ink2:#b5c0cd; --muted:#8794a4;
    --line:#263140; --line2:#34414f; --accent:#6da7ec; --accent-ink:#0b1a2e; --accent-soft:#1b2b44;
    --danger:#f08a8a; --danger-soft:#3a1c1c; --track:#243040; --scrim:rgba(0,0,0,.6);
    --st-open-bg:#1c2c47; --st-open-fg:#9cc0f7;
    --st-prog-bg:#3a2d0c; --st-prog-fg:#f2c15b;
    --st-further-bg:#3d2410; --st-further-fg:#f5a566;
    --st-done-bg:#12301a; --st-done-fg:#7fd38d;
    --st-cancel-bg:#262d36; --st-cancel-fg:#9aa6b4;
    --st-over-bg:#3c1a1a; --st-over-fg:#f19a9a;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70;
    --shadow:0 1px 2px rgba(0,0,0,.45); --hero1:#2b66b3; --hero2:#1d4a85; --hero-sh:0 8px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --panel:#161d26; --panel2:#1b2430; --ink:#e7edf4; --ink2:#b5c0cd; --muted:#8794a4;
  --line:#263140; --line2:#34414f; --accent:#6da7ec; --accent-ink:#0b1a2e; --accent-soft:#1b2b44;
  --danger:#f08a8a; --danger-soft:#3a1c1c; --track:#243040; --scrim:rgba(0,0,0,.6);
  --st-open-bg:#1c2c47; --st-open-fg:#9cc0f7;
  --st-prog-bg:#3a2d0c; --st-prog-fg:#f2c15b;
  --st-further-bg:#3d2410; --st-further-fg:#f5a566;
  --st-done-bg:#12301a; --st-done-fg:#7fd38d;
  --st-cancel-bg:#262d36; --st-cancel-fg:#9aa6b4;
  --st-over-bg:#3c1a1a; --st-over-fg:#f19a9a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.45); --hero1:#2b66b3; --hero2:#1d4a85; --hero-sh:0 8px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1080px;margin:0 auto}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;overflow:hidden;box-shadow:var(--shadow);flex:none}.logo svg{display:block;width:100%;height:100%}
.stamp{font:600 13px/1 var(--mono);border:2px solid var(--ink);padding:8px 7px 7px;border-radius:6px;letter-spacing:.04em;flex:none}
h1{font:700 22px/1.05 var(--disp);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;align-items:center;flex:none;position:relative}
.btn.addbtn{background:var(--accent);color:var(--accent-ink);box-shadow:var(--hero-sh,var(--shadow))}
.btn.addbtn:hover{background:var(--accent)}
.addmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:40;min-width:13rem;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:6px;display:flex;flex-direction:column}
.addmenu button{background:none;border:0;text-align:left;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:500;min-height:44px}
.addmenu button:hover,.addmenu button:focus-visible{background:var(--panel2)}
@media(max-width:699px){.wide-only{display:none!important}}
.btn{border:1px solid var(--line2);background:var(--panel);padding:8px 14px;border-radius:12px;font-weight:500;min-height:40px;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px;border-radius:10px}
.btn.iconbtn{width:40px;border-radius:50%;border-color:transparent;box-shadow:var(--shadow);padding:0;display:inline-flex;align-items:center;justify-content:center}
@media(prefers-reduced-motion:no-preference){.btn:active,.tkt:active,.fab:active,.chip:active{transform:scale(.97)}}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{background:none;border:1px solid transparent;border-radius:4px;width:34px;height:34px;font-size:22px;line-height:1;color:var(--ink2)}
.icon:hover{background:var(--panel2);border-color:var(--line)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 11px 9px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font:500 12px var(--mono);color:var(--muted);margin-left:6px}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:0;background:var(--accent-soft);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--danger-soft)}
.banner p{flex:1 1 18rem}

/* panels & dashboard */
.panel{background:var(--panel);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.panel>h2,.sec-h{font:600 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.group{min-width:0}.group>.sec-h{margin:6px 4px 10px}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-h h2{margin:0;font:600 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.dash{display:grid;gap:18px;margin-top:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:1000px){.dash{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--hero-sh);margin-bottom:12px;container-type:inline-size}
.hero .k-l{color:rgba(255,255,255,.8);letter-spacing:.12em}
.hero-v{font:600 clamp(26px,11cqi,40px)/1.15 var(--mono);margin:6px 0 2px;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero-s{font-size:13px;color:rgba(255,255,255,.82)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.strip>div{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;container-type:inline-size;min-width:0}
.k-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.k-v{font:600 clamp(18px,22cqi,26px)/1.15 var(--mono);margin-top:4px;overflow-wrap:anywhere}
.k-v.zero{color:var(--muted)}
.k-v.bad{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;max-width:100%}
.seg button{background:var(--panel);border:0;padding:6px 12px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar-l{font-size:14px;overflow-wrap:anywhere}
.bar-l em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.bar-t{height:14px;background:var(--track);border-radius:0 4px 4px 0}
.bar-f{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.bar-v{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;text-align:right}
@media(max-width:520px){.bars li{grid-template-columns:minmax(0,1fr) auto}.bars .bar-t{grid-column:1/-1;grid-row:2}}
.split{display:flex;gap:2px;height:8px;margin-bottom:12px}
.split i{display:block;min-width:2px}
.split i:first-child{border-radius:4px 0 0 4px}.split i:last-child{border-radius:0 4px 4px 0}.split i:only-child{border-radius:4px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend b{width:10px;height:10px;border-radius:2px;display:block}
.legend span:last-child{font-variant-numeric:tabular-nums;font-weight:500}

/* status */
.pill{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap}
.pill.open{background:var(--st-open-bg);color:var(--st-open-fg)}
.pill.prog{background:var(--st-prog-bg);color:var(--st-prog-fg)}
.pill.further{background:var(--st-further-bg);color:var(--st-further-fg)}
.pill.done{background:var(--st-done-bg);color:var(--st-done-fg)}
.pill.cancel{background:var(--st-cancel-bg);color:var(--st-cancel-fg)}
.pill.over{background:var(--st-over-bg);color:var(--st-over-fg)}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}

/* status dots */
.st{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--sans);color:var(--ink2);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--st-open-fg);flex:none}
.st.prog i{background:var(--st-prog-fg)}.st.further i{background:var(--st-further-fg)}.st.done i{background:var(--st-done-fg)}.st.cancel i{background:var(--st-cancel-fg)}.st.over{color:var(--danger)}.st.over i{background:var(--danger)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}

/* ticket rows */
.tickets{display:flex;flex-direction:column;gap:10px;min-width:0}
.tkt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px}
.tkt:hover{background:var(--panel2)}
.tkt-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tkt-no{font:600 11.5px var(--mono);color:var(--muted)}
.tkt-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkt-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkt-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tkt-cost{font:600 13px var(--mono)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.searchrow{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.searchrow input{flex:1;min-width:0;border:0;box-shadow:var(--shadow);border-radius:14px;min-height:44px;padding:0 14px}
.fbtn{border:0;box-shadow:var(--shadow);background:var(--panel);color:var(--accent);font-weight:600;border-radius:14px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.fbtn b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}
.lockednote{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);font-size:13.5px;color:var(--ink2)}
.ckbox{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.ck-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ck-list{display:flex;flex-direction:column;gap:6px}
.ck-i{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ck-i .chk{flex:1;min-width:0}
.ckd{text-decoration:line-through;color:var(--muted)}
.ckadd{display:flex;gap:10px;align-items:flex-end}
.ckadd .fld{flex:1;min-width:0}
.tkt-meta.wrap{white-space:normal;overflow:visible}
.pri-high{color:var(--danger,#c0392b);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding:2px 1px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--panel);box-shadow:var(--shadow);color:var(--ink2);border-radius:99px;padding:8px 14px;font-size:13px;white-space:nowrap;transition:transform .08s ease}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fpanel{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding:12px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
.fpanel .fld{flex:1 1 10rem}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(31,95,191,.4);z-index:40;transition:transform .08s ease}
.fab svg{width:26px;height:26px}.fab:disabled{opacity:.5}
@media(min-width:700px){.fab{display:none}}
@media(max-width:699px){body{padding-bottom:110px!important}.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld.grow{flex:1 1 14rem}
.fld.span{grid-column:1/-1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;min-height:40px}
textarea{min-height:76px;resize:vertical}
.sumline{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink2);font-size:13px;margin:0 0 8px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* asset cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:10px}
.ahead{display:flex;gap:12px;align-items:flex-start}.ahead>div:last-child{min-width:0}
.acard h3{font:700 22px/1.1 var(--disp);letter-spacing:.01em;overflow-wrap:anywhere}
.tagline{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{text-align:right;font-variant-numeric:tabular-nums}
.acard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.acard.arch{opacity:.7}

/* photos */
.req,.opt{font-style:normal;font-size:11px;margin-left:6px;letter-spacing:.02em}
.req{color:var(--danger)}.opt{color:var(--muted)}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph label.btn{cursor:pointer}
.thumb{padding:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;width:76px;height:58px;background:var(--panel2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumbx{position:relative;display:inline-block}
.thumbx .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:15px;line-height:22px;padding:0}
.apic-b{padding:0;border:0;background:none;flex:none}
.apic{width:56px;height:56px;border-radius:12px;object-fit:cover;display:block;border:1px solid var(--line2)}
#lb{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:12px}
#lb figure{margin:0;max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#lb img{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;border-radius:8px}
#lb figcaption{color:#fff;font-size:15px;text-align:center}
.atts{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.att{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}

/* table */
.tablewrap{overflow-x:auto;border:0;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;font:600 13px var(--mono);color:var(--accent);text-decoration:underline;text-underline-offset:2px}

/* empty states */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:28px 20px;color:var(--ink2);background:var(--panel)}
.empty .art{width:64px;height:64px;color:var(--accent);margin-bottom:10px}
.empty h2{font:700 24px/1.1 var(--disp);color:var(--ink);margin-bottom:6px;text-transform:none;letter-spacing:.01em}
.empty p{max-width:46rem}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.steps{display:grid;gap:8px;margin:14px 0 0;counter-reset:s;max-width:46rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font:600 13px/26px var(--mono);text-align:center;border:1px solid var(--line2);border-radius:3px;height:28px;width:28px;color:var(--ink)}
.empty.small{padding:18px;text-align:left}
.empty.small h2{font-size:20px}

/* sheets (modals) */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;

const followUpAt=o=>{ if(!isUrgent(o)||o.status!=='Further action'||!o.furtherAt) return null; const t=Date.parse(o.furtherAt); return isFinite(t)?t+FURTHER_DAYS*864e5:null; };

const statusLabel=s=>STATUS_LABEL[s]||s;
const isClosed=o=>!!o&&(o.status==='Completed'||o.status==='Cancelled');

const fmtNo=n=>String(n==null?'':n).replace(/^(WO-)(.*)$/,(m,a,b)=>a+b.replace(/-/g,''));

const ckGate=o=>{ const i=ckItems(o); if(!o||!o.checklist||!i.length) return 'Start the checklist and add at least one step before closing this task.'; if(!i.every(x=>x.done)) return 'Complete every checklist step before closing this task.'; return ''; };
const startedAtOf=o=>o.startedAt||(o.status!=='Open'?(o.createdAt||o.openedOn||''):'');

const assetName=id=>{ const a=S.assets.get(id); return a?a.name:'Unknown equipment'; };

 Home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/>',

 Appliance:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M5 9h14"/><circle cx="12" cy="15" r="3"/>',
 'Garden & outdoor':'<path d="M12 21v-9"/><path d="M12 12c0-4 3-6.5 7-6.5 0 4-2.7 6.5-7 6.5Z"/><path d="M12 15c0-3-2.3-5-5.5-5 0 3 2 5 5.5 5Z"/>',
 'Tools & equipment':'<path d="M14.5 6.5a4 4 0 0 0 4.7 4.7L9 21.4a2.2 2.2 0 0 1-3.1-3.1l10.2-10.2"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/>',
 'Air conditioner':'<rect x="3" y="5" width="18" height="8" rx="2.5"/><path d="M6 16.5c0 1.2 1 1.2 1 2.4M12 16.5c0 1.2 1 1.2 1 2.4M18 16.5c0 1.2 1 1.2 1 2.4"/><path d="M6.5 9.5h6"/>',

 Electrical:'<path d="M13 3 5.5 13.5H11L10 21l8-11h-5.6L13 3Z"/>',

/* ---------- storage ---------- */
async function allocateNumber(code){
  code=code||WO_CODE_DEFAULT;
  const year=new Date().getFullYear();
  const lock=S.db.doc('meta/numbering');
  let state='busy';
  for(let i=0;i<4;i++){
    try{ const r=await lock.acquire({holder:HOLDER,ttlMs:6000}); if(r&&r.acquired){state='held';break;} }
    catch(e){ state='skipped'; break; }
    await sleep(700);
  }
  if(state==='busy') throw new Error('Another device is issuing a number right now. Try again in a moment.');
  const snap=await S.db.collection('workorders').where('year','==',year).get();
  let top=0; snap.docs.forEach(d=>{ const x=d.data(); if((x.code||'')===code) top=Math.max(top,num(x.seq)); });
  const seq=top+1;
  return {year,seq,code,number:'WO-'+code+year+String(seq).padStart(4,'0')};
}

  let store={};
  if(opts&&opts.initial) store=opts.initial;
  else try{ store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ store={}; }
  const subs=new Set();
  const clone=v=>JSON.parse(JSON.stringify(v));
  const seg=p=>p.split('/');
  const has=p=>Object.prototype.hasOwnProperty.call(store,p);
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function persist(){ if(opts&&opts.write){ opts.write(store); return; } try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){ throw {code:'quota_exceeded',message:'The phone has no room left for this app\'s records.'}; } }
  function notify(){ subs.forEach(f=>{ try{ f(); }catch(e){} }); }
  function snapDoc(path){ const ex=has(path); const d=ex?clone(store[path]):undefined; return {id:seg(path).pop(),exists:ex,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}; }
  function cmp(a,op,b){
    switch(op){ case '==':return a===b; case '!=':return a!==b; case '<':return a<b; case '<=':return a<=b; case '>':return a>b; case '>=':return a>=b; }
    return false;
  }
  function inCollection(path){ const n=seg(path).length+1, pre=path+'/'; return Object.keys(store).filter(k=>k.indexOf(pre)===0&&seg(k).length===n); }
  function query(path,filters,order,lim){
    const run=()=>{
      let docs=inCollection(path).map(snapDoc);
      filters.forEach(f=>{ docs=docs.filter(d=>cmp(d.data()[f[0]],f[1],f[2])); });
      if(order){
        const dir=order.dir==='desc'?-1:1;
        docs.sort((a,b)=>{ const x=a.data()[order.field],y=b.data()[order.field];
          if(x===undefined&&y===undefined) return 0; if(x===undefined) return 1; if(y===undefined) return -1;
          return (x<y?-1:x>y?1:0)*dir; });
      } else docs.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
      if(lim) docs=docs.slice(0,lim);
      return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};
    };
    return {
      where:(f,op,v)=>query(path,filters.concat([[f,op,v]]),order,lim),
      orderBy:(field,dir)=>query(path,filters,{field,dir:dir||'asc'},lim),
      limit:n=>query(path,filters,order,n),
      get:()=>Promise.resolve(run()),
      onSnapshot(next){ const fire=()=>next(run()); subs.add(fire); setTimeout(fire,0); return ()=>subs.delete(fire); }
    };
  }
  function docRef(path){
    return {
      id:seg(path).pop(), path,
      get:()=>Promise.resolve(snapDoc(path)),
      set(data){ const old=has(path)?store[path]:undefined; store[path]=clone(data); try{ persist(); }catch(e){ if(old===undefined) delete store[path]; else store[path]=old; return Promise.reject(e); } notify(); return Promise.resolve(); },
      update(data){ if(!has(path)) return Promise.reject({code:'invalid_argument',message:'That record does not exist.'}); return this.set(Object.assign({},store[path],data)); },
      delete(){ delete store[path]; try{ persist(); }catch(e){} notify(); return Promise.resolve(); },
      acquire(){ return Promise.resolve({acquired:true}); },
      onSnapshot(next){ const fire=()=>next(snapDoc(path)); subs.add(fire); setTimeout(fire,0); return ()=>subs.delete(fire); },
      collection:sub=>colRef(path+'/'+sub)
    };
  }
  function colRef(path){
    const q=query(path,[],null,0);
    return Object.assign(q,{path,
      doc:id=>docRef(path+'/'+(id||newId())),
      add(data){ const r=docRef(path+'/'+newId()); return r.set(data).then(()=>r); }});
  }
  return {doc:docRef,collection:colRef};
}
/* ---- installable web app: records live in IndexedDB (far more room than localStorage, which photos would fill) ---- */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('hwo',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function webStore(){
  const db=await idbOpen();
  const get=()=>new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get('db'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  const put=v=>new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,'db'); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  let initial=await get();
  if(!initial){ try{ initial=JSON.parse(localStorage.getItem('hwo:db:v1')||'null'); }catch(e){} }
  let busy=false,again=null;
  const write=snapshot=>{
    again=JSON.parse(JSON.stringify(snapshot));
    if(busy) return; busy=true;
    (async()=>{
      while(again){ const v=again; again=null;
        try{ await put(v); }catch(e){ try{ toast('This device has no room left for the records. Save a backup.',true); }catch(_){} }
      }
      busy=false;
    })();
  };
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  return {initial:initial||{},write};
}
function makeWebDownloads(){
  const types={pdf:'application/pdf',csv:'text/csv',json:'application/json'};
  return {save:async function(req){
    const ext=String(req.filename).split('.').pop().toLowerCase();
    const type=types[ext]||'application/octet-stream';
    const blob=new Blob([req.data],{type});
    try{
      const file=new File([blob],req.filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file]}); return {status:'saved'}; }
        catch(e){ if(e&&e.name==='AbortError') throw {code:'declined'}; }
      }
    }catch(e){ if(e&&e.code==='declined') throw e; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=req.filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); },4000);
    return {status:'saved'};
  }};
}
function makeBridgeDownloads(){
  return {save:async function(req){
    const data=req.data; let bytes;
    if(typeof data==='string') bytes=new TextEncoder().encode(data);
    else if(data instanceof ArrayBuffer) bytes=new Uint8Array(data);
    else bytes=new Uint8Array(data.buffer||data);
    let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    const res=BRIDGE.saveFile(req.filename,btoa(bin));
    if(res!=='ok') throw {code:'unavailable',message:res};
    return {status:'saved'};
  }};
}

async function boot(){
  render();
  const verEl=$('#app-ver'); if(verEl) verEl.textContent='v'+APP_VERSION;
  let db=null,user=null,dl=null;
  if(IS_APP){ db=makeLocalDb(); dl=makeBridgeDownloads(); }
  else if(IS_WEB){ try{ const ws=await webStore(); db=makeLocalDb({initial:ws.initial,write:ws.write}); dl=makeWebDownloads(); }catch(e){ db=null; } }
  else{
    const c=window.claude;
    if(!c||!c.use){ S.noStore=true; render(); return; }
    const get=n=>c.use(n).catch(()=>null);
    [db,user,dl]=await Promise.all([get('db'),get('user'),get('downloads')]);
  }
  S.downloads=dl; S.user=user;
  if(!db){ S.noStore=true; render(); return; }
  S.db=db;
  if(user){ try{ if((await user.can('data.write'))===false) S.readOnly=true; }catch(e){} }
  const timer=setTimeout(()=>{ S.timedOut=true; render(); },10000);
  const ok=()=>{ clearTimeout(timer); S.timedOut=false; };
  const bad=e=>{ clearTimeout(timer); if(e&&e.code==='revoked'){ S.noStore=true; } S.timedOut=true; render(); };
  db.collection('assets').onSnapshot(snap=>{
    S.assets=new Map(snap.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));
    S.ready.assets=true; ok(); render();
  },bad);
  db.collection('workorders').onSnapshot(snap=>{
    S.orders=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.ready.orders=true; ok(); render(); syncReminders();
  },bad);
  db.doc('meta/settings').onSnapshot(s=>{
    if(s.exists){ S.settings=Object.assign({currency:'SAR'},s.data()); }
    render();
  },()=>{});
}

/* ---------- rendering ---------- */
function render(){ renderChrome(); renderView(); if(S.sheet==='settings') renderSettings(); }

function renderChrome(){
  ['dashboard','orders','assets','parts'].forEach(v=>{ const t=$('#tab-'+v); t.setAttribute('aria-selected',String(S.view===v)); t.tabIndex=S.view===v?0:-1; });
  const open=S.orders.filter(isActive).length;
  $('#n-orders').textContent=open?String(open):'';
  $('#n-assets').textContent=S.assets.size?String([...S.assets.values()].filter(a=>!a.archived).length):'';
  $('#btn-add').disabled=!canWrite(); if(!canWrite()) closeAddMenu();
  $('#btn-report').disabled=!reportReady(); $('#btn-report').title=hasDone()?'':'Available once a task is completed';
  const b=$('#banner'); let h='';
  const hasSamples=S.orders.some(o=>o.sample)||[...S.assets.values()].some(a=>a.sample);
  if(S.noStore) h=`<div class="banner warn"><p>Records can't be loaded or saved in this view. Open the page from your Claude artifacts while signed in to use it.</p></div>`;
  else if(S.timedOut&&!(S.ready.assets&&S.ready.orders)) h=`<div class="banner warn"><p>Your records can't be reached yet. They load as soon as the connection answers.</p></div>`;

  b.innerHTML=h;
}

function renderView(){
  const v=$('#view');
  if(S.noStore){ v.innerHTML=emptyIntro(false); return; }
  if(!(S.ready.assets&&S.ready.orders)){ v.innerHTML=emptyIntro(true); return; }
  const f=document.activeElement&&document.activeElement.id;
  if(S.view==='orders'&&f==='f-q'&&$('#orders-results')){ $('#orders-results').innerHTML=ordersResults(); return; }
  if(S.view==='parts'&&f==='p-q'&&$('#parts-results')){ $('#parts-results').innerHTML=partsResults(); return; }
  v.innerHTML=S.view==='orders'?ordersView():S.view==='assets'?assetsView():S.view==='parts'?partsView():dashboardView();
}

/* tasks list */
function filteredOrders(){
  const q=S.f.q.trim().toLowerCase();
  return S.orders.filter(o=>{
    if(S.f.status!=='all'&&FGROUPS[S.f.status]&&!FGROUPS[S.f.status](o)) return false;
    if(S.f.asset&&o.assetId!==S.f.asset) return false;
    if(S.f.year&&String(orderDate(o)).slice(0,4)!==S.f.year) return false;
    if(q){ const hay=[o.number,fmtNo(o.number),o.title,o.description,o.notes,o.doneBy,o.type,assetName(o.assetId)].concat((o.lines||[]).map(l=>[l.name,l.partNo,l.supplier].join(' '))).join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  }).sort(byNumberDesc);
}

/* assets */
function assetStats(){
  const m=new Map();
  for(const o of S.orders){
    let s=m.get(o.assetId); if(!s){ s={n:0,open:0,spent:0,last:'',meter:null,meterDate:''}; m.set(o.assetId,s); }
    s.n++; if(isActive(o)) s.open++;
    if(o.status!=='Cancelled') s.spent+=orderTotals(o).all;
    if(o.status==='Completed'&&o.completedOn&&o.completedOn>s.last) s.last=o.completedOn;
    const d=orderDate(o); if(o.meter!=null&&o.meter!==''&&d>=s.meterDate){ s.meter=o.meter; s.meterDate=d; }
  }
  return m;
}

/* parts */
function partRows(){
  const q=S.partsQ.trim().toLowerCase(); const rows=[];
  for(const o of S.orders){ if(o.status==='Cancelled') continue; for(const l of (o.lines||[])){ if(l.kind!=='part') continue;
    if(q&&[l.name,l.partNo,l.supplier,o.number,fmtNo(o.number),assetName(o.assetId)].join(' ').toLowerCase().indexOf(q)<0) continue; rows.push({o,l}); } }
  return rows.sort((a,b)=>orderDate(b.o).localeCompare(orderDate(a.o))||byNumberDesc(a.o,b.o));
}
function partsView(){
  return `<div class="filters"><label class="fld grow"><span>Search parts</span><input id="p-q" type="search" value="${esc(S.partsQ)}" placeholder="Part name, part number, supplier, equipment" autocomplete="off"></label></div><div id="parts-results">${partsResults()}</div>`;
}
function partsResults(){
  const rows=partRows();
  if(!rows.length) return `<div class="empty small"><h2>${S.partsQ?'No matching parts':'No parts logged yet'}</h2><p>${S.partsQ?'Try a different name or part number.':'Parts you add to a task are collected here, with part numbers, suppliers and prices, so you can find what you bought last time.'}</p></div>`;
  const total=rows.reduce((s,r)=>s+lineTotal(r.l),0);
  return `<p class="sumline"><span><b>${rows.length}</b> part line${rows.length===1?'':'s'}</span><span>Parts cost <b>${money(total)}</b></span></p>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>Part</th><th>Part no.</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Total</th><th>Supplier</th><th>Equipment</th><th>Task</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(fmtDate(orderDate(r.o)))}</td><td>${esc(r.l.name)}</td><td class="mono">${esc(r.l.partNo||'')}</td><td class="num">${esc(num(r.l.qty))}</td><td class="num">${money(num(r.l.unitCost))}</td><td class="num">${money(lineTotal(r.l))}</td><td>${esc(r.l.supplier||'')}</td><td>${esc(assetName(r.o.assetId))}</td><td><button type="button" class="linkbtn" data-action="open-wo" data-id="${esc(r.o.id)}">${esc(r.o.number||r.o.id)}</button></td></tr>`).join('')}</tbody></table></div>`;
}

function blankVisit(){ return {on:false,name:'',contact:'',loc:null,atts:[]}; }
function blankWO(p){
  p=p||{};
  return {isNew:true,number:'',title:p.title||'',assetId:p.assetId||'',type:p.type||'Preventive maintenance',priority:'Normal',status:'Open',openedOn:todayISO(),dueOn:'',completedOn:'',meter:'',doneBy:'Me',description:'',notes:'',lines:[],followUpOf:p.followUpOf||'',furtherAt:'',startedAt:'',closedAt:'',checklist:null,locked:false,visit:blankVisit()};

function openWO(id,prefill){
  if(id){
    const o=S.orders.find(x=>x.id===id); if(!o) return;
    const c=JSON.parse(JSON.stringify(o));
    S.wo=Object.assign(c,{isNew:false,locked:isClosed(o),startedAt:o.startedAt||'',closedAt:o.closedAt||'',checklist:Array.isArray(ckItems(o))&&o.checklist&&Array.isArray(o.checklist.items)?{items:o.checklist.items.map(x=>({id:x.id||('c'+Math.random().toString(36).slice(2,8)),text:x.text||'',done:!!x.done}))}:null,number:o.number||o.id,type:o.type==='Repair'?'Corrective maintenance':(o.type||'Preventive maintenance'),furtherAt:o.furtherAt||'',
      visit:o.visit?{on:true,name:o.visit.name||'',contact:o.visit.contact||'',loc:o.visit.loc||null,atts:(o.visit.atts||[]).map(x=>({src:x.src,caption:x.caption||''}))}:blankVisit(),meter:o.meter==null?'':String(o.meter),dueOn:o.dueOn||'',completedOn:o.completedOn||'',doneBy:o.doneBy||'',description:o.description||'',notes:o.notes||'',
      lines:(o.lines||[]).map(l=>({kind:l.kind||'part',name:l.name||'',partNo:l.partNo||'',supplier:l.supplier||'',qty:String(l.qty==null?'':l.qty),unitCost:String(l.unitCost==null?'':l.unitCost)}))});
  } else S.wo=blankWO(prefill);

}

    <div class="visitbox">

  if(w.locked) host.querySelectorAll('.sheet-b input,.sheet-b select,.sheet-b textarea,.sheet-b [data-action]:not([data-action="view-photo"])').forEach(el=>{ el.disabled=true; });
  keepStill(host,was);

function woAlertNote(w){
  if(isCorrective(w)&&w.priority==='High'){
    let m;
    if(w.status==='Further action'){
      const t=w.furtherAt?Date.parse(w.furtherAt)+FURTHER_DAYS*864e5:Date.now()+FURTHER_DAYS*864e5;
      m='You will be reminded on '+fmtDate(new Date(t).toISOString().slice(0,10))+' if this is still waiting for further action.';
    } else if(isActive(w)) m='Set the status to Further action to be reminded '+FURTHER_DAYS+' days later.';
    else m='Alerts stop once a task is completed or cancelled.';
    return `<p class="alertnote"><span class="bang">!</span> High-priority corrective task. ${esc(m)}</p>`;
  }
  if(isCorrective(w)) return `<p class="hint">Corrective maintenance means something is wrong with the equipment. Set the priority to High to get the ! mark and reminders.</p>`;
  if(w.status==='Further action') return `<p class="hint">Reminders are sent for corrective tasks with High priority.</p>`;
  return '';
}

     <input id="wo-vcap-${i}" class="capin" data-vcap="${i}" type="text" value="${esc(x.caption)}" placeholder="Caption, e.g. Garage entrance" autocomplete="off" aria-label="Caption for photo ${i+1}">

function getPosition(){
  return new Promise((res,rej)=>{
    if(BRIDGE&&typeof BRIDGE.requestLocation==='function'){ locWait={res,rej}; try{ BRIDGE.requestLocation(); }catch(e){ locWait=null; rej({message:'Location is not available here.'}); } return; }
    if(!navigator.geolocation){ rej({message:'Location is not available here.'}); return; }
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>rej({message:e&&e.code===1?'Location permission was declined. Allow it in your settings and try again.':'The location could not be read. Try again with a better signal.'}),
      {enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}
let locWait=null;
window.__locDone=function(ok,a,b,c){ const w=locWait; locWait=null; if(!w) return; if(ok) w.res({lat:Number(a),lng:Number(b),acc:Number(c)}); else w.rej({message:String(a||'The location could not be read.')}); };
async function captureLocation(){
  if(!S.wo||S.locBusy) return;
  S.locBusy=true; renderWO('wo-visit-loc');
  try{
    const p=await getPosition();
    if(S.wo){ S.wo.visit.loc={lat:Number(p.lat.toFixed(6)),lng:Number(p.lng.toFixed(6)),acc:Math.round(p.acc||0),at:new Date().toISOString()}; toast('Location saved'); }
  }catch(e){ toast(e&&e.message?e.message:'The location could not be read.',true); }
  S.locBusy=false; if(S.wo) renderWO('wo-visit-loc');
}
async function addVisitPhoto(input){
  const w=S.wo; const file=input.files&&input.files[0]; input.value='';
  if(!w||!file) return;
  try{
    const url=await shrink(file,1280,.72);
    if(!S.wo) return;
    if(w.visit.atts.length<MAX_ATT) w.visit.atts.push({src:url,caption:''});
    renderWO('wo-vcap-'+(w.visit.atts.length-1));
  }catch(e){ toast(e&&e.message?e.message:'The attachment could not be added.',true); }
}
/* Reminders: the phone apps schedule a notification for each corrective, High-priority task 3 days after it was set to Further action. */
let remTimer=null;
function syncReminders(){
  clearTimeout(remTimer);
  remTimer=setTimeout(()=>{
    if(!BRIDGE||typeof BRIDGE.setReminders!=='function'||!S.ready.orders||!S.ready.assets) return;
    const items=[];
    S.orders.forEach(o=>{ const t=followUpAt(o); if(t===null) return;
      items.push({key:(o.number||o.id)+'@'+o.furtherAt,at:t,title:'Follow-up needed',body:fmtNo(o.number||o.id)+' · '+o.title+' ('+assetName(o.assetId)+') has been waiting for further action for '+FURTHER_DAYS+' days.'}); });
    try{ BRIDGE.setReminders(JSON.stringify(items)); }catch(e){}
  },600);
}
function updateTotals(){
  let sum=0; S.wo.lines.forEach((l,i)=>{ const v=lineTotal(l); sum+=v; const el=document.getElementById('ln-'+i+'-total'); if(el) el.textContent=money(v); });
  const t=$('#wo-total'); if(t) t.textContent=money(sum);
}
function checklistHTML(w){
  const lock=!!w.locked; const no=w.isNew?'this task':fmtNo(w.number);
  if(!w.checklist){
    return lock?'':`<div class="ckbox"><strong>Checklist</strong><p class="hint">A task can only be closed after its checklist is completed.</p><div class="addrow"><button type="button" class="btn" data-action="ck-start">Start checklist for ${esc(no)}</button></div></div>`;
  }
  const items=w.checklist.items; const done=items.filter(x=>x.done).length;
  return `<div class="ckbox"><div class="ck-h"><strong>Checklist · ${esc(no)}</strong><span class="hint" id="ck-count">${done} of ${items.length} done</span></div>
   <div class="ck-list">${items.length?items.map((x,i)=>`<div class="ck-i"><label class="chk"><input type="checkbox" id="ck-${i}" data-ck="${i}"${x.done?' checked':''}><span class="${x.done?'ckd':''}">${esc(x.text)}</span></label>${lock?'':`<button type="button" class="icon" data-action="ck-del" data-i="${i}" aria-label="Remove this step">&times;</button>`}</div>`).join(''):'<p class="hint">No steps yet. Add the steps to tick off.</p>'}</div>
   ${lock?'':`<div class="ckadd"><label class="fld"><span>New step</span><input id="ck-new" type="text" placeholder="e.g. Check tyre pressure" autocomplete="off"></label><button type="button" class="btn sm" data-action="ck-add">Add</button></div>`}</div>`;
}
function ckAdd(){
  if(!S.wo||!S.wo.checklist) return; const el=$('#ck-new'); const text=el?el.value.trim():''; if(!text){ toast('Type the step first.',true); el&&el.focus(); return; }
  S.wo.checklist.items.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text,done:false}); renderWO('ck-new');
}
function onWoInput(e){
  const t=e.target; if(!S.wo||!t.closest||!t.closest('#modal')) return;
  if(t.dataset.lf!==undefined){
    const l=S.wo.lines[+t.dataset.i]; if(!l) return; l[t.dataset.lf]=t.value;
    if(t.dataset.lf==='kind'){ renderWO(t.id); return; }
    updateTotals(); return;
  }
  if(t.dataset.vf!==undefined){
    const k=t.dataset.vf;
    if(k==='on'){ S.wo.visit.on=!!t.checked; renderWO(t.checked?'wo-visit-name':t.id); }
    else S.wo.visit[k]=t.value;
    return;
  }
  if(t.dataset.ck!==undefined){
    const it=S.wo.checklist&&S.wo.checklist.items[+t.dataset.ck]; if(!it) return; it.done=!!t.checked;
    const sp=t.parentNode.querySelector('span'); if(sp) sp.className=it.done?'ckd':'';
    const c=$('#ck-count'); if(c) c.textContent=S.wo.checklist.items.filter(x=>x.done).length+' of '+S.wo.checklist.items.length+' done';
    return;
  }
  if(t.dataset.vcap!==undefined){ const x=S.wo.visit.atts[+t.dataset.vcap]; if(x) x.caption=t.value; return; }
  const f=t.dataset.f; if(!f) return;
  const prev=S.wo[f];
  if(f==='status'&&t.value==='Completed'&&!S.wo.locked){ const g=ckGate(S.wo); if(g){ toast(g,true); renderWO(t.id); return; } }
  if(f==='assetId'&&t.value==='__new'){ openAsset(null,true); renderWO('wo-asset'); return; }
  S.wo[f]=t.value;
  if(f==='assetId') renderWO(t.id);
  if(f==='status'){ if(t.value!=='Open'&&!S.wo.startedAt) S.wo.startedAt=new Date().toISOString(); if(t.value==='Completed'&&!S.wo.completedOn) S.wo.completedOn=todayISO(); S.wo.furtherAt=t.value==='Further action'?(prev==='Further action'&&S.wo.furtherAt?S.wo.furtherAt:new Date().toISOString()):''; renderWO(t.id); }
  if(f==='type'||f==='priority') renderWO(t.id);
}
async function saveWO(){
  const w=S.wo; if(!w||S.saving) return;
  if(!w.title.trim()){ toast('Give the task a title.',true); $('#wo-title')&&$('#wo-title').focus(); return; }
  if(!w.assetId||!S.assets.has(w.assetId)){ toast('Choose the equipment this work is for.',true); $('#wo-asset')&&$('#wo-asset').focus(); return; }
  if(w.meter!==''&&!isFinite(Number(w.meter))){ toast('The reading must be a number.',true); return; }
  if(w.locked||(!w.isNew&&isClosed(S.orders.find(x=>x.id===w.id)))){ toast('This task is closed and can\'t be changed.',true); return; }
  if(w.status==='Completed'){ const g=ckGate(w); if(g){ toast(g,true); return; } }
  const lines=w.lines.filter(l=>l.name.trim()||num(l.unitCost)).map(l=>({kind:l.kind,name:l.name.trim(),partNo:(l.partNo||'').trim(),supplier:(l.supplier||'').trim(),qty:num(l.qty===''?1:l.qty),unitCost:num(l.unitCost)}));
  const now=new Date().toISOString();
  const doc={title:w.title.trim(),assetId:w.assetId,type:w.type,priority:w.priority,status:w.status,openedOn:w.openedOn||todayISO(),dueOn:w.dueOn||'',
    completedOn:w.status==='Completed'?(w.completedOn||todayISO()):'',meter:w.meter===''?null:Number(w.meter),doneBy:w.doneBy.trim(),description:w.description.trim(),notes:w.notes.trim(),lines,
    followUpOf:w.followUpOf||'',sample:!!w.sample,updatedAt:now,
    furtherAt:w.status==='Further action'?(w.furtherAt||now):'',
    startedAt:w.startedAt||(w.status!=='Open'?(w.isNew?now:(w.createdAt||now)):''),closedAt:w.status==='Completed'?(w.closedAt||now):'',
    checklist:w.checklist?{items:w.checklist.items.map(x=>({id:x.id,text:x.text,done:!!x.done}))}:null,
    visit:w.visit&&w.visit.on?{name:w.visit.name.trim(),contact:w.visit.contact.trim(),loc:w.visit.loc||null,atts:w.visit.atts}:null};
  S.saving=true; renderWO();
  try{
    if(w.isNew){
      const n=await allocateNumber(woCode(w.assetId));

function startInstall(){

window.__upd=function(state,msg){ S.dl={state,msg}; if(S.sheet==='settings'){ try{ renderSettings(); }catch(e){} } };
async function checkWebUpdate(quiet){
  if(S.upd&&S.upd.state==='checking') return;
  if(!quiet){ S.upd={state:'checking'}; renderSettings(); }
  let res={state:'error'};
  try{
    const base=IS_IOS?PAGES_URL:location.pathname.replace(/[^\/]*$/,'');
    const r=await fetch(base+'index.html?c='+Date.now(),{cache:'no-store'});
    if(!r.ok) res={state:'unreadable'};
    else{
      const m=(await r.text()).match(/APP_VERSION\s*=\s*'([0-9.]+)'/);
      if(m) res={state:cmpVer(m[1],APP_VERSION)>0?'newer':'current',tag:m[1]};
      else res={state:'unreadable'};
    }
  }catch(e){ res={state:'offline'}; }
  if(quiet&&res.state!=='newer'){ if(S.upd&&S.upd.state==='checking') S.upd=null; return; }
  S.upd=res;
  if(quiet) toast('Version '+res.tag+' is available. Open Settings to update.');
  if(S.sheet==='settings') renderSettings();
}
async function applyWebUpdate(){
  S.dl={state:'progress',msg:'0'}; renderSettings();
  if(IS_IOS){ try{ BRIDGE.updateContent(); }catch(e){ S.dl={state:'error',msg:'The update could not be started.'}; renderSettings(); } return; }
  try{
    if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
    if(window.caches){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
  }catch(e){}
  location.replace(location.pathname+'?u='+Date.now()+location.hash);
}
window.__iosUpdate=function(ok,msg){
  if(ok){ toast('Updated. Reloading…'); setTimeout(()=>location.reload(),600); }
  else{ S.dl={state:'error',msg:String(msg||'The update failed. Check your connection and try again.')}; if(S.sheet==='settings'){ try{ renderSettings(); }catch(e){} } }
};
async function checkUpdate(){
  if(IS_WEB||IS_IOS) return checkWebUpdate(false);
  if(S.upd&&S.upd.state==='checking') return;
  S.upd={state:'checking'}; renderSettings();
  try{
    const r=await fetch('https://api.github.com/repos/MalekW96/home-work-orders/releases/latest',{headers:{Accept:'application/vnd.github+json'}});
    if(r.status===404||r.status===401||r.status===403) S.upd={state:'unreadable'};
    else if(!r.ok) S.upd={state:'error'};
    else{
      const j=await r.json(); const tag=String(j.tag_name||'').replace(/^v/i,'');
      const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name||''));
      S.upd={state:cmpVer(tag,APP_VERSION)>0?'newer':'current',tag,apkUrl:apk?apk.browser_download_url:''};
    }
  }catch(e){ S.upd={state:'offline'}; }
  renderSettings();
}
function readRestore(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(String(rd.result||''));
      const assets=Array.isArray(j.assets)?j.assets.filter(a=>a&&a.id&&a.name):[];
      const orders=Array.isArray(j.workOrders)?j.workOrders.filter(o=>o&&(o.number||o.id)&&o.title):[];
      if(!assets.length&&!orders.length) throw new Error('empty');
      S.restore={ok:true,assets,orders,msg:'Found '+assets.length+' equipment and '+orders.length+' task'+(orders.length===1?'':'s')+' in '+file.name+'. Records with the same number are replaced.'};
    }catch(e){ S.restore={ok:false,msg:'That file is not a backup made by this app.'}; }
    renderSettings();
  };
  rd.onerror=()=>{ S.restore={ok:false,msg:'The file could not be read.'}; renderSettings(); };
  rd.readAsText(file);
}
async function doRestore(){
  const r=S.restore; if(!r||!r.ok||S.saving) return;
  S.saving=true;
  try{
    for(const a of r.assets){ const doc=Object.assign({},a); delete doc.id; await S.db.doc('assets/'+a.id).set(doc); }
    for(const o of r.orders){
      const doc=Object.assign({},o); const no=String(o.number||o.id); delete doc.id; doc.number=no;
      const m=/^WO-(?:([A-Z])-?)?(\d{4})-?(\d{4,})$/.exec(no); if(m){ doc.year=Number(m[2]); doc.seq=Number(m[3]); if(m[1]) doc.code=m[1]; }
      await S.db.doc('workorders/'+no).set(doc);
    }
    toast('Restored '+r.assets.length+' asset'+(r.assets.length===1?'':'s')+' and '+r.orders.length+' task'+(r.orders.length===1?'':'s')); S.restore=null;
  }catch(e){ fail(e,'Not restored'); }
  S.saving=false; renderSettings();
}

    filename='work-orders-'+todayISO()+'.csv';
    data=toCSV([['Task','Title','Equipment','Category','Type','Priority','Status','Opened','Due','Completed','Reading','Unit','Done by','Parts','Labour','Other','Total','Work performed','Notes','Garage / technician','Contact','Location']].concat(orders.map(o=>{
      const a=S.assets.get(o.assetId)||{}; const t=orderTotals(o);
      return [fmtNo(o.number),o.title,a.name,a.category,o.type,o.priority,statusLabel(o.status),o.openedOn,o.dueOn,o.completedOn,o.meter,a.meterUnit,o.doneBy,t.part.toFixed(2),t.labour.toFixed(2),t.other.toFixed(2),t.all.toFixed(2),o.description,o.notes,o.visit?o.visit.name:'',o.visit?o.visit.contact:'',o.visit&&o.visit.loc?o.visit.loc.lat+', '+o.visit.loc.lng:''];
    })));
  } else if(what==='lines'){
    filename='cost-lines-'+todayISO()+'.csv'; const rows=[['Task','Date','Equipment','Type','Description','Part no.','Supplier','Qty','Unit cost','Line total']];
    orders.forEach(o=>(o.lines||[]).forEach(l=>rows.push([fmtNo(o.number),orderDate(o),assetName(o.assetId),l.kind,l.name,l.partNo,l.supplier,l.qty,num(l.unitCost).toFixed(2),lineTotal(l).toFixed(2)])));
    data=toCSV(rows);
  } else {
    filename='home-work-orders-backup-'+todayISO()+'.json';
    data=JSON.stringify({exportedAt:new Date().toISOString(),currency:S.settings.currency,assets:[...S.assets.values()],workOrders:orders},null,2);
  }
  try{ await S.downloads.save({filename,data}); if(IS_APP&&!IS_IOS) toast('Saved '+filename+' to Downloads'); }
  catch(e){ if(e&&e.code!=='declined') toast(e&&e.code==='unavailable'?'Downloads are not available here.':'The file could not be saved.',true); }
}
async function clearSamples(){
  if(!S.confirmClear){ S.confirmClear=true; renderChrome(); return; }
  S.confirmClear=false;
  try{
    for(const o of S.orders.filter(o=>o.sample)) await S.db.doc('workorders/'+o.id).delete();
    for(const a of [...S.assets.values()].filter(a=>a.sample)) await S.db.doc('assets/'+a.id).delete();
    toast('Example records cleared');
  }catch(e){ fail(e,'Not cleared'); }
  renderChrome();
}

/* ---------- PDF report ---------- */
/* REPORT-START */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pdfDate(s){ const d=parseD(s); return d?d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear():''; }
function pdfMoney(n){ return String(S.settings.currency||'SAR').toUpperCase()+' '+num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* The built-in PDF fonts cover Latin text only, so anything else is swapped for "?" rather than drawn as noise. */
function pdfText(s){ return String(s==null?'':s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[  ]/g,' ').replace(/[^\n\x20-\x7E\xA1-\xFF]/g,'?'); }
function reportData(opt){
  let start=''; const d=new Date();
  if(opt.period==='year') start=d.getFullYear()+'-01-01';
  else if(opt.period==='12m'){ d.setFullYear(d.getFullYear()-1); start=localISO(d); }
  const list=S.orders.filter(o=>o.status!=='Cancelled'&&(!opt.asset||o.assetId===opt.asset)&&(!start||orderDate(o)>=start)).sort((a,b)=>byNumberDesc(b,a));
  return {start,list};
}
function buildReportPDF(deps,opt){
  const list=reportData(opt).list;
  const doc=new deps.JsPDF({unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=14;
  const ACC=[31,95,191], INK=[20,32,46], MUT=[102,114,127];
  const periodLabel={year:'This year ('+new Date().getFullYear()+')','12m':'Last 12 months',all:'All time'}[opt.period]||'All time';
  const assetLabel=opt.asset?assetName(opt.asset):'All equipment';
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(INK[0],INK[1],INK[2]); doc.text('Maintenance report',M,20);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
  doc.text('I Got This',M,26);
  doc.text(pdfText('Period: '+periodLabel+'    Equipment: '+assetLabel+'    Generated: '+pdfDate(todayISO())),M,31);
  doc.setDrawColor(ACC[0],ACC[1],ACC[2]); doc.setLineWidth(0.6); doc.line(M,34,W-M,34);

  const tot={part:0,labour:0,other:0,all:0}; let done=0, open=0; const byAsset=new Map();
  for(const o of list){
    const t=orderTotals(o); tot.part+=t.part; tot.labour+=t.labour; tot.other+=t.other; tot.all+=t.all;
    if(o.status==='Completed') done++; else if(isActive(o)) open++;
    const e=byAsset.get(o.assetId)||{n:0,part:0,labour:0,other:0,all:0};
    e.n++; e.part+=t.part; e.labour+=t.labour; e.other+=t.other; e.all+=t.all; byAsset.set(o.assetId,e);
  }
  let y=44;
  const figs=[['Total cost',pdfMoney(tot.all)],['Tasks',String(list.length)],['Completed',String(done)],['Open',String(open)]];
  const cw=(W-2*M)/figs.length;
  figs.forEach((f,i)=>{
    const x=M+i*cw;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(MUT[0],MUT[1],MUT[2]); doc.text(f[0].toUpperCase(),x,y);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(INK[0],INK[1],INK[2]); doc.text(pdfText(f[1]),x,y+7);
  });
  y+=18;

  const section=title=>{ if(y>H-45){ doc.addPage(); y=20; } doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(INK[0],INK[1],INK[2]); doc.text(title,M,y); y+=3; };
  const table=o=>{
    const cfg=Object.assign({startY:y,margin:{left:M,right:M,bottom:16},theme:'striped',
      styles:{font:'helvetica',fontSize:8.5,cellPadding:1.8,textColor:INK,overflow:'linebreak'},
      headStyles:{fillColor:ACC,textColor:255,fontStyle:'bold'},
      footStyles:{fillColor:[230,235,241],textColor:INK,fontStyle:'bold'},
      alternateRowStyles:{fillColor:[245,247,249]}},o);
    if(deps.autoTable) deps.autoTable(doc,cfg); else doc.autoTable(cfg);
    y=doc.lastAutoTable.finalY+9;
  };
  const right=[1,2,3,4,5].reduce((m,i)=>{ m[i]={halign:'right'}; return m; },{});

  if(!opt.asset&&byAsset.size){
    section('Spend by equipment');
    const rows=[...byAsset.entries()].sort((a,b)=>b[1].all-a[1].all);
    table({head:[['Equipment','Tasks','Parts','Labour','Other','Total']],
      body:rows.map(r=>[pdfText(assetName(r[0])),String(r[1].n),pdfMoney(r[1].part),pdfMoney(r[1].labour),pdfMoney(r[1].other),pdfMoney(r[1].all)]),
      foot:[['All equipment',String(list.length),pdfMoney(tot.part),pdfMoney(tot.labour),pdfMoney(tot.other),pdfMoney(tot.all)]],
      showFoot:'lastPage',columnStyles:right});
  }

  section('Tasks');
  table({head:[['No.','Date','Equipment','Title','Status','Cost']],
    body:list.map(o=>[fmtNo(o.number||o.id),pdfDate(orderDate(o)),pdfText(assetName(o.assetId)),pdfText(o.title),statusLabel(o.status),pdfMoney(orderTotals(o).all)]),
    columnStyles:{0:{cellWidth:28},1:{cellWidth:23},2:{cellWidth:34},4:{cellWidth:22},5:{cellWidth:28,halign:'right'}}});

  if(opt.parts){
    const prow=[]; for(const o of list) for(const l of (o.lines||[])) if(l.kind==='part') prow.push([pdfDate(orderDate(o)),pdfText(l.name),pdfText(l.partNo),String(num(l.qty)),pdfMoney(num(l.unitCost)),pdfMoney(lineTotal(l)),pdfText(l.supplier),o.number||o.id]);
    if(prow.length){
      section('Parts used');
      table({head:[['Date','Part','Part no.','Qty','Unit cost','Total','Supplier','Task']],body:prow,
        styles:{font:'helvetica',fontSize:8,cellPadding:1.6,textColor:INK,overflow:'linebreak'},
        columnStyles:{0:{cellWidth:19},2:{cellWidth:22},3:{cellWidth:10,halign:'right'},4:{cellWidth:22,halign:'right'},5:{cellWidth:22,halign:'right'},7:{cellWidth:27}}});
    }
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    doc.text('Cancelled tasks are not included.',M,H-8); doc.text('Page '+i+' of '+n,W-M,H-8,{align:'right'});
  }
  return doc;
}
/* REPORT-END */
const hasDone=()=>S.orders.some(o=>o.status==='Completed');
const reportReady=()=>!!(S.db&&S.downloads&&S.ready.orders&&S.ready.assets&&hasDone());
function openReport(pre){ if(!hasDone()){ toast('The PDF report is available once a task is completed.',true); return; }  if(!S.report) S.report={period:'year',asset:'',parts:true}; if(pre&&pre.asset!==undefined) S.report.asset=pre.asset; S.sheet='report'; renderReport(); }
function updateReportCount(){
  const c=$('#rp-count'); if(!c||!S.report) return;
  const n=reportData(S.report).list.length;
  c.textContent=n?n+' task'+(n===1?'':'s')+' will be included.':'No tasks match these choices.';
}
function renderReport(){
  const host=$('#modal'); const was=!host.hidden&&!!host.querySelector('#rp-h'); host.hidden=false; const r=S.report;
  const assets=[...S.assets.values()].sort(byName);
  host.innerHTML=`<div class="scrim" data-action="close-modal"></div>
  <section class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="rp-h">
   <header class="sheet-h"><div><p class="eyebrow">PDF report</p><h2 id="rp-h">Maintenance report</h2></div><button type="button" class="icon" data-action="close-modal" aria-label="Close">&times;</button></header>
   <div class="sheet-b">
    <label class="fld"><span>Period</span><select id="rp-period">${opt([['year','This year'],['12m','Last 12 months'],['all','All time']],r.period)}</select></label>
    <label class="fld"><span>Equipment</span><select id="rp-asset">${opt([['','All equipment']].concat(assets.map(a=>[a.id,a.name])),r.asset)}</select></label>
    <label class="chk"><input id="rp-parts" type="checkbox"${r.parts?' checked':''}><span>Include the list of parts used</span></label>
    <p class="hint" id="rp-count"></p>
    <p class="hint">Cancelled tasks are left out. Text outside the Latin alphabet shows as "?" in the PDF.</p>
   </div>
   <footer class="sheet-f"><span></span><div class="acts"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="make-report"${S.saving?' disabled':''}>${S.saving?'Creating…':'Create PDF'}</button></div></footer></section>`;
  keepStill(host,was); syncInert(); updateReportCount();
}
async function makeReport(){
  if(S.saving||!S.report) return;
  const jp=window.jspdf&&window.jspdf.jsPDF;
  if(!jp){ toast('The PDF library did not load. Check your connection and reload the page.',true); return; }
  if(!S.downloads){ toast('Downloads are not available in this view.',true); return; }
  if(!reportData(S.report).list.length){ toast('No tasks match these choices.',true); return; }
  S.saving=true; renderReport();
  try{
    const doc=buildReportPDF({JsPDF:jp,autoTable:window.jspdf.autoTable},S.report);
    const data=doc.output('arraybuffer');
    await S.downloads.save({filename:'maintenance-report-'+todayISO()+'.pdf',data});
    S.saving=false; closeSheet('report'); toast(IS_IOS?'Report ready':IS_APP?'Report saved to Downloads':'Report saved');
  }catch(e){
    S.saving=false; renderReport();
    if(!(e&&e.code==='declined')) toast(e&&e.code==='unavailable'?'Downloads are not available here.':'The report could not be created.',true);
  }
}

/* ---------- sheets plumbing ---------- */
function keepStill(host,was){ if(was){ const sh=host.querySelector('.sheet'); if(sh) sh.style.animation='none'; } }
function syncInert(){
  const m1=$('#modal'),m2=$('#modal2');
  $('#app').inert=!m1.hidden||!m2.hidden;
  m1.inert=!m2.hidden;
}
function closeSheet(which){
  if(which==='wo'||which==='settings'||which==='report'){ S.wo=null; S.sheet=''; const h=$('#modal'); h.innerHTML=''; h.hidden=true; }
  syncInert();
}
function closeAddMenu(){ const m=$('#addmenu'); if(m&&!m.hidden){ m.hidden=true; const b=$('#btn-add'); if(b) b.setAttribute('aria-expanded','false'); return true; } return false; }
function toggleAddMenu(){ const m=$('#addmenu'); if(!m) return; if(!closeAddMenu()){ m.hidden=false; $('#btn-add').setAttribute('aria-expanded','true'); const f=m.querySelector('button'); if(f) f.focus(); } }
function closeTop(){
  if(closeAddMenu()) return;
  if(closePhoto()) return;
  if(!$('#modal2').hidden){ S.asset=null; renderAsset(); return; }
  if(!$('#modal').hidden) closeSheet(S.sheet||'wo');
}

/* ---------- events ---------- */
function setView(v){ S.view=v; if(location.hash!=='#'+v){ try{ location.hash=v; }catch(e){} } render(); window.scrollTo(0,0); }
document.addEventListener('click',e=>{
  const own=e.target.closest&&e.target.closest('#btn-add'); if(!own) closeAddMenu();
  const el=e.target.closest&&e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  switch(a){
    case 'tab': setView(el.dataset.view); break;
    case 'toggle-add': toggleAddMenu(); break;
    case 'new-wo': if(canWrite()) openWO(null); break;
    case 'open-wo': openWO(id); break;
    case 'close-modal': closeSheet(S.sheet||'wo'); break;
    case 'close-modal2': S.asset=null; renderAsset(); break;
    case 'save-wo': saveWO(); break;
    case 'followup': { const w=S.wo; if(w) openWO(null,{assetId:w.assetId,title:w.title,type:w.type,followUpOf:w.number}); break; }
    case 'visit-loc': captureLocation(); break;
    case 'visit-loc-clear': if(S.wo){ S.wo.visit.loc=null; renderWO('wo-visit-loc'); } break;
    case 'add-line': if(S.wo){ S.wo.lines.push({kind:el.dataset.kind,name:'',partNo:'',supplier:'',qty:'1',unitCost:''}); renderWO('ln-'+(S.wo.lines.length-1)+'-name'); } break;
    case 'del-line': if(S.wo){ S.wo.lines.splice(+el.dataset.i,1); renderWO(); } break;
    case 'new-asset': if(canWrite()) openAsset(null,false); break;
    case 'edit-asset': openAsset(id,false); break;
    case 'view-photo': { if(el.dataset.k==='visit'){ const x=S.wo&&S.wo.visit.atts[+el.dataset.i||0]; if(x) showPhoto(x.src,x.caption); break; } const src=id?S.assets.get(id):S.asset; if(src){ const l=id?attsOf(src):src.attachments; const x=l[+el.dataset.i||0]; if(x) showPhoto(x.src,x.caption); } break; }
    case 'del-photo': if(el.dataset.k==='visit'){ if(S.wo){ S.wo.visit.atts.splice(+el.dataset.i||0,1); renderWO(); } } else if(S.asset){ S.asset.attachments.splice(+el.dataset.i||0,1); renderAsset(); } break;
    case 'asset-history': S.f={status:'all',asset:id,year:'',q:''}; setView('orders'); break;
    case 'asset-wo': if(canWrite()) openWO(null,{assetId:id}); break;
    case 'save-asset': saveAsset(); break;
    case 'archive-asset': toggleArchive(); break;
    case 'delete-asset': deleteAsset(); break;
    case 'settings': openSettings(); break;
    case 'export': exportData(el.dataset.what); break;
    case 'report': openReport(); break;
    case 'report-task': { const aid=S.wo&&S.wo.assetId; closeSheet('wo'); openReport({asset:aid||''}); break; }
    case 'do-restore': doRestore(); break;
    case 'check-update': S.dl=null; checkUpdate(); break;
    case 'apply-web-update': applyWebUpdate(); break;
    case 'install-update': startInstall(); break;
    case 'make-report': makeReport(); break;
    case 'clear-samples': clearSamples(); break;
    case 'chip': S.f.status=el.dataset.status; renderView(); break;
    case 'clear-asset': S.f.asset=''; if(S.f.status==='all') S.f.status='open'; renderView(); break;
    case 'ck-start': if(S.wo&&!S.wo.locked){ S.wo.checklist={items:[]}; renderWO('ck-new'); } break;
    case 'ck-add': ckAdd(); break;
    case 'ck-del': if(S.wo&&S.wo.checklist&&!S.wo.locked){ S.wo.checklist.items.splice(+el.dataset.i,1); renderWO(); } break;
    case 'toggle-filters': S.showFilters=!S.showFilters; renderView(); break;
    case 'range': S.range=el.dataset.range; render(); break;
    case 'toggle-archived': S.showArchived=!S.showArchived; render(); break;
  }
});
function onInput(e){
  const t=e.target; if(!t||!t.id&&!t.dataset) return;
  if(t.dataset&&t.dataset.cap!==undefined&&S.asset){ const x=S.asset.attachments[+t.dataset.cap]; if(x) x.caption=t.value; return; }
  if(t.dataset&&t.dataset.af!==undefined&&S.asset){
    const k=t.dataset.af; S.asset[k]=t.value;
    if(k==='category'){ if(t.value==='Vehicle'){ S.asset.role='parent'; S.asset.parentId=''; } renderAsset(t.id); }
    else if(k==='role'){ if(t.value==='parent') S.asset.parentId=''; renderAsset(t.id); }
    else if(k==='parentId'){ renderAsset(t.id); }
    return;
  }
  if(t.closest&&t.closest('#modal')&&S.wo&&S.sheet==='wo'){ onWoInput(e); return; }
  switch(t.id){
    case 'f-q': S.f.q=t.value; $('#orders-results').innerHTML=ordersResults(); break;
    case 'f-status': S.f.status=t.value; renderView(); break;
    case 'f-asset': S.f.asset=t.value; renderView(); break;
    case 'f-year': S.f.year=t.value; renderView(); break;
    case 'p-q': S.partsQ=t.value; $('#parts-results').innerHTML=partsResults(); break;
    case 'rp-period': if(S.report){ S.report.period=t.value; updateReportCount(); } break;
    case 'rp-asset': if(S.report){ S.report.asset=t.value; updateReportCount(); } break;
    case 'rp-parts': if(S.report) S.report.parts=!!t.checked; break;
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='st-cur'){ saveCurrency(e.target.value); return; }
  if(e.target&&e.target.dataset&&e.target.dataset.photo){ addPhoto(e.target); return; }
  if(e.target&&e.target.id==='st-restore'){ readRestore(e.target.files&&e.target.files[0]); return; }
  onInput(e);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target&&e.target.id==='ck-new'){ e.preventDefault(); ckAdd(); return; } if(e.key==='Escape'&&(!$('#modal').hidden||!$('#modal2').hidden||!$('#addmenu').hidden)){ e.preventDefault(); closeTop(); } });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['dashboard','orders','assets','parts'].indexOf(h)>=0&&h!==S.view){ S.view=h; render(); } });
(function(){ const h=location.hash.slice(1); if(['dashboard','orders','assets','parts'].indexOf(h)>=0) S.view=h; })();

/* called by the phone app's Back button; true means the page handled it */
window.__back=function(){
  if(closeAddMenu()) return true;
  if(closePhoto()) return true;
  if(!$('#modal2').hidden){ S.asset=null; renderAsset(); return true; }
  if(!$('#modal').hidden){ closeSheet(S.sheet||'wo'); return true; }
  if(S.view!=='dashboard'){ setView('dashboard'); return true; }
  return false;
};
boot();
if(IS_WEB||IS_IOS){ try{ if(/^\?u=/.test(location.search)) history.replaceState(null,'',location.pathname+location.hash); }catch(e){} setTimeout(()=>{ if(navigator.onLine!==false) checkWebUpdate(true); },4000); }
})();
</script>
